<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LoL 페이스메이커</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%23d8b45a'/%3E%3C/svg%3E">
<style>
  /* OP.GG 인게임 스카우터 & AI 코치 플로팅 위젯 HUD (AGENTS.md 3-4절).
     바깥 배경은 완전 투명(transparent)으로 두고 380x560 안에 4개 정밀 위젯 카드가 스크롤 없이 들어간다. */
  :root {
    --card-alpha: 0.94;
    --card: rgba(15, 18, 27, var(--card-alpha));
    --card-inner: rgba(24, 29, 43, .78);
    --line: rgba(255, 255, 255, .13);
    --line2: rgba(255, 255, 255, .24);
    --text: #f8fafc;
    --sub: #cbd5e1;
    --dim: #94a3b8;
    --accent: #7c6eff;
    --blue: #5383e8;
    --red-team: #e84057;
    --gold: #fbbf24;
    --cyan: #38e8ff;
    --green: #34d399;
    --yellow: #facc15;
    --red: #fb7185;
  }
  * { box-sizing: border-box; }
  ::-webkit-scrollbar { width: 3px; height: 3px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, .2); border-radius: 99px; }
  html, body {
    margin: 0;
    padding: 0;
    background: transparent !important;
    color: var(--text);
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }
  body {
    font: 11.5px/1.25 -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Segoe UI", sans-serif;
    max-width: 380px;
    margin: 0 auto;
    padding: 2px 4px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    overflow-x: hidden;
    text-shadow: 0 1px 2px rgba(0, 0, 0, .85);
  }
  button { font: inherit; color: inherit; cursor: pointer; text-shadow: inherit; }
  button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 1px; }
  .num { font-variant-numeric: tabular-nums; }

  /* 개별 플로팅 다크 글래스 위젯 */
  .hud-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: 0 6px 16px rgba(0, 0, 0, .62);
    backdrop-filter: blur(10px);
  }

  /* ── 위젯 0: 상단 OP.GG 스타일 컨트롤 도크 ── */
  .top-card { padding: 4px 6px; display: flex; flex-direction: column; gap: 2px; }
  .top { display: flex; align-items: center; gap: 3px; cursor: grab; }
  .top:active { cursor: grabbing; }
  .brand-pill {
    display: inline-grid; place-items: center; padding: 2px 6px; border-radius: 5px;
    background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; border: 1px solid rgba(255, 255, 255, .25);
    font-size: 10px; font-weight: 900; letter-spacing: -.3px; flex: none; text-shadow: none;
  }
  .brand-pill:hover { filter: brightness(1.12); }

  /* OP.GG 스타일 개별 위젯 ON/OFF 토글 서랍 */
  .opgg-drawer {
    display: flex; flex-direction: column; gap: 4px;
    padding: 6px 8px; margin-top: 3px; border-radius: 8px;
    background: rgba(12, 15, 24, .96); border: 1px solid var(--line2);
  }
  .sw-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 10px; }
  .sw-row {
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
    font-size: 10.5px; font-weight: 800; color: var(--text); cursor: pointer;
    background: transparent; border: 0; padding: 2px 0; text-align: left;
  }
  .sw-pill {
    width: 24px; height: 13px; border-radius: 99px; background: rgba(255, 255, 255, .18);
    position: relative; flex: none; transition: background .15s;
  }
  .sw-pill::after {
    content: ""; position: absolute; top: 1.5px; left: 2px; width: 10px; height: 10px;
    border-radius: 50%; background: #94a3b8; transition: transform .15s, background .15s;
  }
  .sw-row[aria-pressed="true"] .sw-pill { background: rgba(124, 110, 255, .45); }
  .sw-row[aria-pressed="true"] .sw-pill::after { transform: translateX(10px); background: #8b7cff; }
  body.hide-order #strats { display: none !important; }
  body.hide-sub .brief-box { display: none !important; }
  body.hide-gold .lanes-sec { display: none !important; }
  body.hide-build .build-top, body.hide-build #buy { display: none !important; }
  body.hide-skill .skill-strip { display: none !important; }
  .grip { color: var(--sub); font-size: 11px; font-weight: 900; padding: 0 1px; letter-spacing: -1px; flex: none; }
  .live {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 4px; padding: 3px 7px; border-radius: 6px;
    background: rgba(255, 255, 255, .05); border: 1px solid var(--line); font-weight: 800; font-size: 11px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left;
  }
  .live.on { color: var(--green); border-color: rgba(52, 211, 153, .45); background: rgba(52, 211, 153, .11); }
  .live:not(.on) { color: var(--yellow); border-color: rgba(250, 204, 21, .35); }
  .fx {
    padding: 3px 5px; border-radius: 6px; border: 1px solid rgba(251, 191, 36, .55); background: rgba(251, 191, 36, .16);
    color: var(--gold); font-weight: 800; white-space: nowrap; font-size: 10.5px;
  }
  .fx[aria-pressed="false"] { border-color: var(--line); background: rgba(255, 255, 255, .04); color: var(--dim); }
  .ctrl {
    padding: 3px 5px; border-radius: 6px; border: 1px solid var(--line); background: rgba(255, 255, 255, .05);
    color: var(--sub); font-weight: 800; white-space: nowrap; font-size: 10.5px;
  }
  .ctrl:hover { border-color: var(--line2); color: var(--text); }
  .ctrl.active, .ctrl[aria-pressed="true"] {
    border-color: rgba(124, 110, 255, .85); background: rgba(124, 110, 255, .25); color: #efeaff;
  }
  .hk-bar {
    display: flex; justify-content: space-between; align-items: center; gap: 6px;
    padding: 0 2px; font-size: 10.5px; font-weight: 700; color: var(--dim);
  }
  .hk-bar .warn-fs { color: var(--yellow); font-weight: 800; }
  .mini-bar {
    padding: 5px 8px; font-size: 11.5px; font-weight: 800; color: var(--text);
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
  body.minimized .win, body.minimized .sec, body.minimized .demo, body.minimized .foot, body.minimized .hk-bar { display: none !important; }
  body.minimized { min-height: 0; }
  body.focus-mode .lanes-sec, body.focus-mode .brief-box, body.focus-mode .demo, body.focus-mode .foot,
  body.focus-mode .mrow, body.focus-mode .strat.sub, body.focus-mode .tip { display: none !important; }
  body.focus-mode { min-height: 0; }

  /* ── 위젯 1: AI 판세 스카우터 & 티어별 실시간 오더 ── */
  .win {
    padding: 5px 8px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    background: linear-gradient(160deg, rgba(20, 25, 40, var(--card-alpha)), rgba(13, 17, 27, var(--card-alpha)));
  }
  .win-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .win-left { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .prob { font-size: 24px; font-weight: 900; line-height: 1; letter-spacing: -.8px; color: var(--text); }
  .win-titles { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .win-titles b { font-size: 11px; font-weight: 800; color: var(--sub); }
  .tac {
    display: inline-block; padding: 1px 7px; border-radius: 999px; font-weight: 800; border: 1px solid;
    font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tac.ahead { color: var(--green); border-color: rgba(52, 211, 153, .5); background: rgba(52, 211, 153, .14); }
  .tac.even { color: var(--yellow); border-color: rgba(250, 204, 21, .5); background: rgba(250, 204, 21, .14); }
  .tac.behind { color: var(--red); border-color: rgba(251, 113, 133, .5); background: rgba(251, 113, 133, .14); }
  .win-right { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; flex: none; }
  .phase-tag { font-size: 10.5px; font-weight: 700; color: var(--sub); }
  .chips { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 3px; }
  .chip {
    font-size: 10.5px; font-weight: 800; padding: 1px 6px; border-radius: 5px;
    background: rgba(255, 255, 255, .07); border: 1px solid var(--line); color: var(--sub);
  }
  .chip.pos { color: var(--green); border-color: rgba(52, 211, 153, .4); background: rgba(52, 211, 153, .12); }
  .chip.neg { color: var(--red); border-color: rgba(251, 113, 133, .4); background: rgba(251, 113, 133, .12); }

  /* 승률 게이지 바 */
  .prob-track {
    height: 4px; width: 100%; border-radius: 99px; background: rgba(232, 64, 87, .35);
    overflow: hidden; position: relative;
  }
  .prob-fill {
    height: 100%; width: 50%; border-radius: 99px;
    background: linear-gradient(90deg, #3b82f6, #38e8ff);
    transition: width .25s ease;
  }
  .stale-msg { color: var(--yellow); font-size: 11px; font-weight: 700; }

  /* OP.GG 증강체/티어표 스타일 우선순위 전략 슬롯 */
  .strat-list { display: flex; flex-direction: column; gap: 4px; }
  .strat {
    background: var(--card-inner); border: 1px solid var(--line);
    border-radius: 7px; padding: 4px 7px; cursor: pointer;
  }
  .strat.urgent { border-color: rgba(251, 113, 133, .4); background: rgba(251, 113, 133, .1); }
  .strat.gold { border-color: rgba(251, 191, 36, .4); background: rgba(251, 191, 36, .09); }
  .strat.macro { border-color: rgba(52, 211, 153, .4); background: rgba(52, 211, 153, .09); }
  .strat-head { display: flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 800; color: var(--text); }
  .tier-badge {
    display: inline-grid; place-items: center; padding: 1px 5px; border-radius: 4px;
    font-size: 10px; font-weight: 900; flex: none; text-shadow: none; letter-spacing: -.2px;
  }
  .tier-s { background: linear-gradient(135deg, #f59e0b, #fbbf24); color: #111827; }
  .tier-a { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #ffffff; }
  .strat.urgent .tier-s { background: linear-gradient(135deg, #e11d48, #fb7185); color: #ffffff; }
  .strat-tag {
    font-size: 10.5px; font-weight: 800; padding: 1px 5px; border-radius: 4px;
    background: rgba(255, 255, 255, .09); color: var(--sub); flex: none;
  }
  .strat-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .strat-detail {
    margin: 2px 0 0; font-size: 11px; color: var(--sub); line-height: 1.3;
    display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden;
  }
  .strat.sub .strat-detail { display: none; }
  .strat.open .strat-detail { display: block; -webkit-line-clamp: unset; }

  /* OP.GG 'AI 에이전트 자막' 스타일 감독 브리핑 바 */
  .brief-box {
    display: flex; flex-direction: column; gap: 2px;
    background: rgba(124, 110, 255, .11); border: 1px solid rgba(124, 110, 255, .3);
    border-radius: 7px; padding: 3px 7px 4px;
  }
  .brief-badge {
    display: flex; align-items: center; justify-content: space-between; gap: 4px;
    font-size: 10px; font-weight: 900; color: #ddd6fe;
  }
  .brief-src {
    font-size: 9.5px; font-weight: 800; padding: 0 4px; border-radius: 4px;
    background: rgba(255, 255, 255, .1); color: var(--sub);
  }
  .brief-src.llm { background: rgba(52, 211, 153, .22); color: var(--green); }
  .brief-text {
    margin: 0; font-size: 10.5px; font-weight: 700; color: #f1f5f9; line-height: 1.26;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }

  /* ── 공통 위젯 헤더 ── */
  .sec { padding: 5px 8px; }
  .sec-head {
    margin: 0 0 3px; font-size: 11.5px; color: var(--text); font-weight: 900;
    display: flex; justify-content: space-between; gap: 6px; align-items: center;
  }
  .sec-title { display: flex; align-items: center; gap: 5px; }
  .sec-ico {
    width: 15px; height: 15px; border-radius: 4px; display: inline-grid; place-items: center;
    background: rgba(251, 191, 36, .18); color: var(--gold); font-size: 10px; font-weight: 900; text-shadow: none;
  }
  .sec-head small { color: var(--sub); font-weight: 700; font-size: 10.5px; }

  /* ── 위젯 2: OP.GG '아이템 골드 비교' & 10인 라인 스카우터 ── */
  .tug-hdr {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 11px; font-weight: 800; margin-bottom: 3px;
  }
  .tug-blue { color: #7aa2f7; }
  .tug-red { color: #f7768e; }
  .tug-mid { font-size: 11.5px; font-weight: 900; }
  .tug-mid.blue-lead { color: #7aa2f7; }
  .tug-mid.red-lead { color: #f7768e; }
  .tug-mid.even-lead { color: var(--gold); }
  .tug-bar {
    height: 3.5px; width: 100%; border-radius: 99px; background: var(--red-team);
    overflow: hidden; margin-bottom: 4px;
  }
  .tug-fill { height: 100%; width: 50%; background: var(--blue); transition: width .25s ease; }

  .lanes { display: flex; flex-direction: column; gap: 2.5px; }
  .scouter-row {
    display: grid; grid-template-columns: 1fr 42px 1fr; align-items: center; gap: 4px;
    height: 20px; padding: 0 4px; border-radius: 5px;
    background: rgba(255, 255, 255, .035); border: 1px solid rgba(255, 255, 255, .06);
  }
  .scouter-row.me-row {
    border-color: rgba(251, 191, 36, .45);
    background: linear-gradient(90deg, rgba(251, 191, 36, .12), rgba(255, 255, 255, .04));
  }
  .sc-side {
    display: flex; align-items: center; gap: 4px; min-width: 0; position: relative;
    height: 16px; padding: 0 2px; border-radius: 4px; overflow: hidden;
  }
  .sc-side.right { justify-content: flex-end; }
  .sc-bar {
    position: absolute; top: 0; bottom: 0; opacity: .22; pointer-events: none; border-radius: 3px;
  }
  .sc-side.left .sc-bar { left: 0; background: var(--blue); }
  .sc-side.right .sc-bar { right: 0; background: var(--red-team); }
  .ava {
    width: 18px; height: 18px; border-radius: 4px; border: 1px solid var(--line2); background: #161d2e;
    overflow: hidden; display: grid; place-items: center; font-size: 9.5px; font-weight: 800; color: var(--sub);
    flex: none; position: relative; z-index: 1;
  }
  .ava.me-ava { border-color: var(--gold); box-shadow: 0 0 4px rgba(251, 191, 36, .6); }
  .ava img { width: 100%; height: 100%; display: block; object-fit: cover; }
  .sc-name {
    font-size: 11px; font-weight: 700; color: var(--text); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; position: relative; z-index: 1;
  }
  .sc-gold {
    font-size: 11px; font-weight: 800; color: #e2e8f0; flex: none;
    margin-left: auto; position: relative; z-index: 1;
  }
  .sc-side.right .sc-gold { margin-left: 0; margin-right: auto; }
  .sc-empty { font-size: 10.5px; color: rgba(255, 255, 255, .22); font-weight: 700; padding: 0 4px; }
  .sc-dead {
    font-size: 9.5px; font-weight: 900; padding: 0 3px; border-radius: 3px;
    background: rgba(232, 64, 87, .35); color: #fecdd3; flex: none; position: relative; z-index: 1;
  }
  .sc-mid {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    line-height: 1; flex: none;
  }
  .sc-pos { font-size: 9.5px; font-weight: 800; color: var(--dim); }
  .sc-diff { font-size: 10px; font-weight: 900; }
  .sc-diff.ahead { color: var(--green); }
  .sc-diff.behind { color: var(--red); }
  .sc-diff.even { color: var(--sub); }

  /* ── 위젯 3: OP.GG 추천 아이템 빌드 슬롯 & 스킬 마스터 도크 ── */
  .build-top {
    display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 5px;
  }
  .gold-bar {
    flex: 1; min-width: 0; font-size: 11px; color: var(--gold); font-weight: 800;
    background: rgba(251, 191, 36, .11); border: 1px solid rgba(251, 191, 36, .32);
    border-radius: 6px; padding: 3px 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .mrow { display: flex; align-items: center; gap: 3px; flex: none; }
  .mrow .lab { color: var(--sub); font-size: 10.5px; font-weight: 800; margin: 0 1px 0 4px; }
  .mrow .lab:first-child { margin-left: 0; }
  .icon {
    width: 24px; height: 24px; border-radius: 5px; border: 1px solid var(--line2); background: #161d2e;
    display: grid; place-items: center; font-size: 10px; font-weight: 800; color: var(--sub);
    overflow: hidden; flex: none; position: relative;
  }
  .icon img { width: 100%; height: 100%; display: block; border-radius: 4px; }
  .mrow .icon { overflow: visible; }
  .mrow .icon.owned { opacity: .45; }
  .mrow .icon .ck {
    position: absolute; right: -3px; bottom: -3px; width: 11px; height: 11px; border-radius: 50%; background: var(--green);
    color: #04130c; font-size: 8.5px; font-weight: 900; display: grid; place-items: center; text-shadow: none;
  }
  .mrow .icon .tier-tag {
    position: absolute; top: -4px; left: -3px; padding: 0 3px; border-radius: 3px;
    background: #8b5cf6; color: #fff; font-size: 8.5px; font-weight: 900; line-height: 1.2; text-shadow: none;
  }

  /* 3코어 추천 아이템 가로 슬롯 체인 ([아이콘+이름] ▶ [아이콘+이름] ▶ [아이콘+이름]) */
  .buy { display: flex; align-items: center; gap: 3px; }
  .buy .arr { color: var(--sub); font-weight: 900; font-size: 9.5px; flex: none; }
  .card {
    position: relative; flex: 1; min-width: 0;
    display: flex; align-items: center; gap: 4px;
    background: var(--card-inner); border: 1.5px solid var(--line);
    border-radius: 7px; padding: 4px 4px 3px; text-align: left;
  }
  .card .icon { width: 25px; height: 25px; border-radius: 5px; flex: none; }
  .card-info { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 1px; }
  .card .nm { font-size: 10.5px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); letter-spacing: -.2px; }
  .card .gd { color: var(--gold); font-size: 10px; font-weight: 800; line-height: 1; }
  .card .badge {
    position: absolute; top: -7px; right: 4px; white-space: nowrap;
    font-size: 9.5px; font-weight: 900; padding: 0 5px; border-radius: 999px; text-shadow: none;
  }
  .card.owned .badge { background: #143628; color: var(--green); border: 1px solid rgba(52, 211, 153, .45); }
  .card.now-buy .badge { background: var(--gold); color: #171102; }
  .card.owned { opacity: .48; }

  .now-buy {
    border-color: var(--gold); box-shadow: 0 0 8px rgba(251, 191, 36, .45);
    animation: pulseGold 1.3s ease-in-out infinite;
  }
  .now-skill {
    border-color: var(--cyan) !important; box-shadow: 0 0 8px rgba(56, 232, 255, .55);
    animation: pulseCyan 1.3s ease-in-out infinite;
  }
  @keyframes pulseGold { 50% { box-shadow: 0 0 2px var(--gold), 0 0 4px rgba(251, 191, 36, .2); } }
  @keyframes pulseCyan { 50% { box-shadow: 0 0 2px var(--cyan), 0 0 4px rgba(56, 232, 255, .2); } }
  body.fx-off .now-buy { animation: none; box-shadow: none; border-color: var(--line); }
  body.fx-off .now-skill { animation: none; box-shadow: none; border-color: var(--line) !important; }
  @media (prefers-reduced-motion: reduce) { .now-buy, .now-skill { animation: none; } }

  /* 스킬 추천 바 */
  .skill-strip {
    margin-top: 5px; padding-top: 4px; border-top: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
  }
  .skill-left { display: flex; align-items: center; gap: 5px; min-width: 0; flex: 1; }
  .skill-title { font-size: 11px; font-weight: 900; color: var(--text); flex: none; }
  .skill-lv { color: var(--sub); font-size: 10.5px; font-weight: 800; flex: none; }
  .skill-when { color: var(--cyan); font-size: 11px; font-weight: 900; flex: none; }
  .tip {
    color: var(--sub); font-size: 10.5px; font-weight: 600; margin: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
  }
  .key {
    display: inline-grid; place-items: center; width: 21px; height: 21px; border-radius: 5px;

function skillPlan(order) {
  const keys = order ? order.split(">").map((s) => s.trim()) : [];
  const count = Object.fromEntries(keys.map((k) => [k, 0]));
  const plan = [];
  for (let lv = 1; lv <= 18; lv++) {
    if (lv === 6 || lv === 11 || lv === 16) { plan.push("R"); continue; }
    const cap = Math.min(Math.floor((lv + 1) / 2), 5);
    const pick = keys.find((k) => (lv <= 3 ? count[k] === 0 : count[k] < cap)) || null;
    if (pick) count[pick] += 1;
    plan.push(pick);
  }
  return plan;
}

const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const mmss = (t) => { const s = Math.max(0, Math.floor(t || 0)); return `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`; };

function icon(item) {
  const box = el("span", "icon");
  if (ddVersion && Number.isInteger(item.item_id)) {
    const img = new Image();
    img.alt = item.name; img.loading = "lazy";
    img.dataset.fb = item.name.slice(0, 3);
    img.src = `https://ddragon.leagueoflegends.com/cdn/${encodeURIComponent(ddVersion)}/img/item/${item.item_id}.png`;
    box.append(img);
  } else box.textContent = item.name.slice(0, 3);
  return box;
}
document.addEventListener("error", (e) => {
  const img = e.target;
  if (img instanceof HTMLImageElement && img.dataset.fb != null) { const p = img.parentElement; p.textContent = img.dataset.fb; }
}, true);

function miniRow(target, items, owned, withTier) {
  target.replaceChildren(...items.slice(0, 3).map((it, idx) => {
    const own = owned.has(it.item_id);
    const m = icon(it);
    if (own) m.classList.add("owned");
    m.title = `${it.name} ${it.gold}G · ${it.why}${own ? " · ✓ 보유 완료" : ""}`;
    m.setAttribute("aria-label", m.title);
    if (own) m.append(el("span", "ck", "✓"));
    else if (withTier && idx === 0) m.append(el("span", "tier-tag", "S"));
    return m;
  }));
}

function stratTone(cat) {
  if (/수성|영혼 저지|부활|템포 조절|위협|바론 수성/.test(cat)) return "urgent";
  if (/귀환|골드|파워/.test(cat)) return "gold";
  if (/오브젝트|수적 우위|바론 운영|영혼 확정|스노우볼|전 라인/.test(cat)) return "macro";
  return "";
}

function makeAvatar(p, isMe) {
  const ava = el("div", "ava" + (isMe ? " me-ava" : ""));
  const cid = p && p.champion_id;
  const name = (p && p.champion) || "-";
  if (ddVersion && cid && /^[A-Za-z0-9_]+$/.test(cid)) {
    const img = document.createElement("img");
    img.src = `https://ddragon.leagueoflegends.com/cdn/${ddVersion}/img/champion/${cid}.png`;
    img.alt = name;
    img.onerror = () => { img.remove(); ava.textContent = name.slice(0, 2); };
    ava.append(img);
  } else {
    ava.textContent = name.slice(0, 2);
  }
  return ava;
}

function renderLanes(s) {
  const allLanes = s.lanes || [];
  const boxEl = $("lanes");
  let allySum = 0, enemySum = 0, maxGold = 500;
  for (const ln of allLanes) {
    const ag = (ln.ally && ln.ally.item_gold) || 0;
    const eg = (ln.enemy && ln.enemy.item_gold) || 0;
    allySum += ag;
    enemySum += eg;
    if (ag > maxGold) maxGold = ag;
    if (eg > maxGold) maxGold = eg;
  }

  $("blueGoldTxt").textContent = `블루팀 ${allySum.toLocaleString()}G`;
  $("redGoldTxt").textContent = `레드팀 ${enemySum.toLocaleString()}G`;
  const rawDiff = allySum - enemySum;
  const diffEl = $("diffGoldTxt");
  if (rawDiff > 50) {
    diffEl.textContent = `◀ +${rawDiff.toLocaleString()}G`;
    diffEl.className = "tug-mid blue-lead";
  } else if (rawDiff < -50) {
    diffEl.textContent = `+${Math.abs(rawDiff).toLocaleString()}G ▶`;
    diffEl.className = "tug-mid red-lead";
  } else {
    diffEl.textContent = "박빙 0G";
    diffEl.className = "tug-mid even-lead";
  }
  const totalG = allySum + enemySum;
  const bluePct = totalG > 0 ? Math.max(12, Math.min(88, Math.round((allySum / totalG) * 100))) : 50;
  $("tugFill").style.width = `${bluePct}%`;

  const rows = allLanes.map((ln) => {
    const a = ln.ally || {};
    const e = ln.enemy || {};
    const aValid = a.champion && a.champion !== "미확인";
    const eValid = e.champion && e.champion !== "미확인";
    const row = el("div", "scouter-row" + (ln.is_me ? " me-row" : ""));
    row.title = `${ln.lane_ko}: ${a.champion || "-"}(${a.kda || "-"}, CS ${a.cs || 0}) vs ${e.champion || "-"}(${e.kda || "-"}, CS ${e.cs || 0})`;

    // 좌측 (블루/아군)
    const left = el("div", "sc-side left");
    if (aValid) {
      const aGold = a.item_gold || 0;
      const bar = el("div", "sc-bar");
      bar.style.width = `${Math.min(100, Math.round((aGold / maxGold) * 100))}%`;
      left.append(bar, makeAvatar(a, ln.is_me), el("span", "sc-name", a.champion));
      if (a.is_dead && a.respawn_timer > 0) left.append(el("span", "sc-dead num", `${Math.round(a.respawn_timer)}s`));
      left.append(el("span", "sc-gold num", `${aGold.toLocaleString()}G`));
    } else {
      left.append(el("span", "sc-empty", "—"));
    }

    // 중앙 (라인·골드 격차)
    const mid = el("div", "sc-mid");
    const posTag = POS_SHORT[ln.position] || (ln.lane_ko === "매치업 미확인" ? "VS" : ln.lane_ko);
    mid.append(el("span", "sc-pos", posTag));
    if (aValid && eValid) {
      const gd = (a.item_gold || 0) - (e.item_gold || 0);
      const dTxt = gd === 0 ? "0" : `${gd > 0 ? "+" : ""}${Math.abs(gd) >= 1000 ? (Math.round(gd / 100) / 10) + "k" : gd}`;
      mid.append(el("span", `sc-diff num ${ln.status}`, dTxt));
    }

    // 우측 (레드/상대)
    const right = el("div", "sc-side right");
    if (eValid) {
      const eGold = e.item_gold || 0;
      const bar = el("div", "sc-bar");
      bar.style.width = `${Math.min(100, Math.round((eGold / maxGold) * 100))}%`;
      right.append(bar, el("span", "sc-gold num", `${eGold.toLocaleString()}G`));
      if (e.is_dead && e.respawn_timer > 0) right.append(el("span", "sc-dead num", `${Math.round(e.respawn_timer)}s`));
      right.append(el("span", "sc-name", e.champion), makeAvatar(e, false));
    } else {
      right.append(el("span", "sc-empty", "—"));
    }

    row.append(left, mid, right);
    return row;
  });
  boxEl.replaceChildren(...rows);
}

function compactRecallMessage(msg) {
  if (!msg) return "카드를 누르면 보유 표시";
  const m1 = msg.match(/보유\s*([0-9,]+G).*?\[([^\]]+)\].*?([0-9,]+G)$/);
  if (m1) return `${m1[1]} 보유 · ${m1[2]} -${m1[3]}`;
  const m2 = msg.match(/([0-9,]+G)\s*보유.*?\[([^\]]+)\]\s*즉시 구매/);
  if (m2) return `${m2[1]} 보유 · ${m2[2]} 즉시 구매!`;
  return msg
    .replace(" · 다음 목표 ", " → ")
    .replace(/\(남은 비용 [0-9,]+G\)/g, "");
}

function render() {
  if (!view || !view.strategy) return;
  const s = view.strategy, b = s.build_advice;
  const live = view.mode === "live";
  $("live").classList.toggle("on", live);
  const stale = live && view.stale;
  $("liveText").textContent = `${live ? (stale ? "🟠 LIVE · 서버 재연결 중" : "🟢 게임 중 LIVE") : "🟡 게임 중 시뮬레이션"} (${mmss(view.t)})`;

  const wp = Math.round(s.win_prob * 100);
  $("prob").textContent = `${wp}%`;
  $("probBar").style.width = `${Math.max(8, Math.min(92, wp))}%`;
  $("tac").className = `tac ${s.state}`;
  $("tac").textContent = s.tactical_badge || s.state_ko;
  $("phaseNote").textContent = `${s.phase_label} · ${mmss(view.t)} · 생존 ${s.alive.ally}v${s.alive.enemy}`;

  const chips = [];
  const gDiff = s.team_gold_diff || 0;
  chips.push(el("span", "chip num " + (gDiff > 300 ? "pos" : gDiff < -300 ? "neg" : ""), `골드 ${gDiff >= 0 ? "+" : ""}${gDiff.toLocaleString()}G`));
  for (const f of (s.key_factors || []).slice(0, 2)) {
    if (!f.startsWith("팀 골드")) chips.push(el("span", "chip num", f));
  }
  $("factors").replaceChildren(...chips.slice(0, 2));

  $("staleMsg").hidden = !stale;
  $("staleMsg").textContent = stale ? "서버 연결이 끊겨 마지막 계산 값을 보여요" : "";

  // OP.GG 스타일 아이템 골드 비교 & 10인 라인 스카우터
  $("compNote").textContent = (s.enemy_comp && s.enemy_comp.profile_label) ? `상대: ${s.enemy_comp.profile_label}` : "";
  renderLanes(s);

  // OP.GG 티어표 스타일 실시간 맞춤 전략 (S·1순위 + A·2순위 슬롯)
  $("carryNote").textContent = s.ally_carry ? `캐리: ${s.ally_carry}` : "";
  const stratNodes = (s.strategies || []).slice(0, 2).map((st, idx) => {
    const cls = "strat " + stratTone(st.category) + (idx === 0 ? " main" : " sub");
    const card = el("div", cls);
    const head = el("div", "strat-head");
    const tier = el("span", "tier-badge " + (idx === 0 ? "tier-s" : "tier-a"), idx === 0 ? "S·1순위" : "A·2순위");
    head.append(tier, el("span", "strat-tag", st.category), el("span", "strat-title", st.title));
    card.append(head, el("p", "strat-detail", st.detail));
    card.title = `${st.title}\n${st.detail}`;
    card.addEventListener("click", () => card.classList.toggle("open"));
    return card;
  });
  $("strats").replaceChildren(...stratNodes);
  $("demoBar").hidden = live;

  // 추천 아이템 빌드 슬롯 & 보유 골드 연동
  const rec = s.recall_advice || {};
  $("recallBar").textContent = compactRecallMessage(rec.message);
  $("recallBar").title = rec.message || "";
  $("champ").textContent = [b.my_champion, b.enemy_top_threat && `vs ${b.enemy_top_threat}`].filter(Boolean).join(" ") || "카드를 누르면 보유 표시";
  miniRow($("starter"), b.starter_items || [], view.owned, false);
  miniRow($("situ"), b.situational_items || [], view.owned, true);

  const items = b.recommended_items || [];
  const nextBuy = items.find((it) => !view.owned.has(it.item_id));
  $("buy").replaceChildren(...items.flatMap((it, idx) => {
    const own = view.owned.has(it.item_id), now = it === nextBuy;
    const card = el("button", "card" + (own ? " owned" : "") + (now ? " now-buy" : ""));
    card.type = "button"; card.dataset.item = String(it.item_id);
    card.setAttribute("aria-pressed", String(own));
    card.title = `${it.name} ${it.gold}G · ${it.why}`;
    if (own || now) card.append(el("span", "badge", own ? "✓ 보유 완료" : "지금 구매 추천"));
    const info = el("div", "card-info");
    info.append(el("div", "nm", it.name), el("div", "gd num", `${it.gold}G`));
    card.append(icon(it), info);
    return idx ? [el("span", "arr", "▶"), card] : [card];
  }));

  // 스킬 추천 바
  const order = b.skill_order.order;
  $("lv").textContent = view.level ? `Lv ${view.level}` : "";
  $("nextWhen").textContent = view.next ? `[${view.next}] ${view.when === "next_level" ? "다음" : "지금"}` : "";
  const keys = order ? order.split(">").map((k) => k.trim()) : (view.next ? [view.next] : []);
  $("keys").replaceChildren(...keys.flatMap((k, i) => {
    const isNext = k === view.next;
    const cap = el("span", "key" + (isNext ? " now-skill" : " off"), k);
    return i ? [el("span", null, "▶"), cap] : [cap];
  }));
  $("focus").textContent = b.tactical_tip || b.skill_order.focus;
  $("focus").title = b.tactical_tip || b.skill_order.focus || "";

  // Windows HUD 상태 표시
  const hw = view.hudWindow;
  if (hw) {
    const ctLabel = hw.click_through ? "F8 통과 ON" : "F8 클릭통과";
    const lolLabel = hw.lol_detected ? "LoL 추적 중" : "F9 숨김";
    $("hkHint").textContent = `${ctLabel} · ${lolLabel}`;
    const fsWarn = typeof hw.lol_window_mode_warning === "boolean"
      ? hw.lol_window_mode_warning
      : (hw.lol_window_mode === "fullscreen");
    $("fsWarn").hidden = !fsWarn;
  }

  $("foot").textContent = `모델 ${s.model_version || "-"} · 실시간 종합 전략(전 라인·골드·아이템·오브젝트)`;
  requestBriefing(s, view.ctx);
  document.querySelectorAll("[data-demo]").forEach((btn) => btn.setAttribute("aria-pressed", String(view.mode === "demo" && btn.dataset.demo === view.demo)));
  syncCardRegions();
}

// ── AI 감독 전략 브리핑 (H5·M7·M8: category 키 + 최소 20초 간격 + 모드 변경 시 폐기 + '동적 전략'/'브리핑 없음') ──
let briefKey = null, briefBusy = false, lastBriefAt = 0;
function briefingKey(s) {
  const b = s.build_advice;
  const laneSig = (s.lanes || []).map((l) => `${l.position}:${l.status}`);
  const stSig = (s.strategies || []).slice(0, 2).map((x) => x.category);
  return JSON.stringify([s.phase, s.state, b.my_champion, laneSig, stSig, Math.round(s.win_prob * 50)]);
}
async function requestBriefing(s, ctx) {
  const key = briefingKey(s);
  const now = Date.now();
  if (!ctx || briefBusy || key === briefKey) return;
  if (lastBriefAt && (now - lastBriefAt) < BRIEF_MIN_MS) return;
  const reqMode = view ? view.mode : null;
  const reqDemo = view ? view.demo : null;
  briefBusy = true; briefKey = key; lastBriefAt = now;
  try {
    const res = await fetch("/strategy/briefing", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(ctx) });
    if (!res.ok) throw new Error(String(res.status));
    const r = await res.json();
    if (!view || view.mode !== reqMode || (reqMode === "demo" && view.demo !== reqDemo)) return;
    const llm = r.source === "llm";
    $("briefText").textContent = r.briefing;
    $("briefText").title = r.briefing || "";
    $("briefSrc").textContent = llm ? `LLM · ${r.llm_model}` : "동적 전략";
    $("briefSrc").className = llm ? "brief-src llm" : "brief-src";
  } catch (_) {
    if (!view || view.mode !== reqMode || (reqMode === "demo" && view.demo !== reqDemo)) return;
    $("briefText").textContent = "브리핑 없음";
    $("briefSrc").textContent = "동적 전략";
    briefKey = null;
  } finally {
    lastBriefAt = Date.now();
    briefBusy = false;
  }
}

$("buy").addEventListener("click", (e) => {
  const card = e.target.closest("[data-item]");
  if (!card || !view) return;
  const id = Number(card.dataset.item);
  view.owned.has(id) ? view.owned.delete(id) : view.owned.add(id);
  render();
});

// ── 이펙트 ON/OFF ──
function setFx(on) {
  document.body.classList.toggle("fx-off", !on);
  $("fx").setAttribute("aria-pressed", String(on));
  $("fx").textContent = on ? "이펙트 ON" : "이펙트 OFF";
  try { localStorage.setItem("lolpace.overlay.fx", on ? "on" : "off"); } catch (_) {}
}
$("fx").addEventListener("click", () => setFx(document.body.classList.contains("fx-off")));
let fxSaved = null;
try { fxSaved = localStorage.getItem("lolpace.overlay.fx"); } catch (_) {}
setFx(fxSaved !== "off");

// ── Win32·macOS Swift·Electron 인게임 팝업 제어 (M6: X-Bridge-Token 이 있을 때만 HTTP 전송해 단독 열람 시 403 방지) ──
function controlHeaders() {
  const h = { "Content-Type": "application/json" };
  if (BRIDGE_TOKEN) h["X-Bridge-Token"] = BRIDGE_TOKEN;
  return h;
}
function sendWindowCmd(cmd) {
  try {
    if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.macHud) {
      window.webkit.messageHandlers.macHud.postMessage(cmd);
    }
  } catch (_) {}
  if (/Electron/i.test(navigator.userAgent)) {
    console.debug("__HUD_CMD__:" + JSON.stringify(cmd));
  }
  if (!BRIDGE_TOKEN) return;
  fetch(WINDOW_URL, { method: "POST", headers: controlHeaders(), body: JSON.stringify(cmd) }).catch(() => {});
}

// Electron 투명 오버레이에서 카드 밖 빈 영역은 클릭을 게임으로 통과시킨다
if (/Electron/i.test(navigator.userAgent)) {
  let passThrough = false;
  window.addEventListener("mousemove", (e) => {
    const onWidget = !!e.target.closest(".hud-card, .demo, button");
    const wantPass = !onWidget;
    if (wantPass !== passThrough) {
      passThrough = wantPass;
      console.debug(passThrough ? "__HUD_PASSTHROUGH__:1" : "__HUD_PASSTHROUGH__:0");
    }
  });
}

let dragStart = null;
$("dragBar").addEventListener("mousedown", (e) => {
  if (e.target.closest("button")) return;
  dragStart = { x: e.screenX, y: e.screenY };
});
window.addEventListener("mouseup", (e) => {
  if (!dragStart) return;
  const dx = Math.round(e.screenX - dragStart.x);
  const dy = Math.round(e.screenY - dragStart.y);
  dragStart = null;
  if (Math.abs(dx) > 4 || Math.abs(dy) > 4) sendWindowCmd({ dx, dy });
});

// ── 데모 ──
async function runDemo(name, lock) {
  const d = DEMOS[name];
  try {
    const res = await fetch("/strategy", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(d.ctx) });
    if (!res.ok) throw new Error(`서버 ${res.status}`);
    const strat = await res.json();
    if (lock) demoLock = true;
    if (!lock && (demoLock || (bridgeAlive && lastLive))) return;
    const b = strat.build_advice;
    const owned = new Set([...(d.ctx.me.items || []), ...b.recommended_items.slice(0, d.ownedSteps).map((i) => i.item_id)].filter(Number.isInteger));
    const plan = skillPlan(b.skill_order.order);
    view = { mode: "demo", demo: name, t: d.t, strategy: strat, ctx: d.ctx, owned, level: d.level, next: plan[d.level - 1], when: "now", hudWindow: lastLive ? lastLive.hud_window : null };
    lastBriefAt = 0;  // 데모 버튼 전환 시에는 새 시나리오 브리핑을 바로 표시
    render();
  } catch (err) {
    $("briefText").textContent = `서버에 연결하지 못했어요 (${err.message})`;
  }
}
document.querySelectorAll("[data-demo]").forEach((btn) => btn.addEventListener("click", () => runDemo(btn.dataset.demo, true)));

// ── 브리지 폴링 (H8: /strategy 없을 때 /coach 최소 폴백, M7: stale 은 strategy_error 만) ──
function coachFallbackView(st) {
  const c = st.coach, b = c.build_advice;
  const goal = (c.coaching && c.coaching[0]) ? c.coaching[0].message : "지금 페이스 유지";
  return {
    mode: "live",
    t: st.game_time_sec,
    strategy: {
      phase: "mid",
      phase_label: "코치 폴백",
      win_prob: c.my_win_prob,
      state: b.state,
      state_ko: b.state === "ahead" ? "우세" : b.state === "behind" ? "열세" : "박빙",
      tactical_badge: b.posture,
      team_gold_diff: 0,
      alive: { ally: 5, enemy: 5 },
      key_factors: [c.pace],
      lanes: [],
      ally_carry: null,
      enemy_comp: null,
      recall_advice: { message: "카드를 누르면 보유 표시" },
      strategies: [{ category: "코치 폴백", title: goal, detail: b.tactical_tip || b.posture }],
      build_advice: b,
      model_version: c.model_version,
      summary_briefing: goal,
    },
    ctx: null,
    owned: new Set((st.owned_items || []).map((i) => i.itemID)),
    level: st.level,
    next: st.next_skill,
    when: st.next_skill_when,
    hudWindow: st.hud_window || null,
    stale: !!st.coach_error,
  };
}
function applyLive(st) {
  if (!st.strategy && st.coach) {
    view = coachFallbackView(st);
    render();
    return;
  }
  view = {
    mode: "live",
    t: st.game_time_sec,
    strategy: st.strategy,
    ctx: st.live_context,
    owned: new Set((st.owned_items || []).map((i) => i.itemID)),
    level: st.level,
    next: st.next_skill,
    when: st.next_skill_when,
    hudWindow: st.hud_window || null,
    stale: !!st.strategy_error,
  };
  render();
}
async function poll() {
  try {
    const res = await fetch(BRIDGE_URL, { cache: "no-store" });
    const st = await res.json();
    if (st.hud_window && view) view.hudWindow = st.hud_window;
    bridgeAlive = !!(st.connected && (st.strategy || st.coach));
    if (bridgeAlive) { lastLive = st; if (!demoLock) applyLive(st); }
    else if (view && view.mode === "live") { view.mode = "demo"; render(); }
  } catch (_) {
    bridgeAlive = false;
    if (view && view.mode === "live") { view.mode = "demo"; render(); }
  }
}
$("live").addEventListener("click", () => {
  demoLock = false;
  if (bridgeAlive && lastLive) applyLive(lastLive);
});

// ── 투명도 (글자 대비는 100%로 유지하고 카드 배경 알파와 OS 창 알파만 연동) & 최소화 & 종료 ──
const OPAC_STEPS = [0.94, 0.82, 0.68];
let opacIdx = 0;
try {
  const savedOp = Number(localStorage.getItem("lol_hud_opac") || "0.94");
  const idx = OPAC_STEPS.indexOf(savedOp);
  if (idx >= 0) opacIdx = idx;
} catch (_) {}
function applyOpac(pushNative) {
  const val = OPAC_STEPS[opacIdx] || 0.94;
  document.documentElement.style.setProperty("--card-alpha", String(val));
  $("opac").textContent = `${Math.round(val * 100)}%`;
  if (pushNative) sendWindowCmd({ opacity: val });
}
applyOpac(true);
$("opac").addEventListener("click", () => {
  opacIdx = (opacIdx + 1) % OPAC_STEPS.length;
  applyOpac(true);
  try { localStorage.setItem("lol_hud_opac", String(OPAC_STEPS[opacIdx])); } catch (_) {}
});

let lastRectsSig = "";
function syncCardRegions() {
  const rects = [];
  for (const card of document.querySelectorAll(".hud-card, .demo button")) {
    if (card.hidden || card.offsetParent === null) continue;
    const r = card.getBoundingClientRect();
    if (r.width > 0 && r.height > 0) {
      rects.push([Math.max(0, Math.floor(r.left)), Math.max(0, Math.floor(r.top)), Math.ceil(r.width), Math.ceil(r.height)]);
    }
  }
  const sig = JSON.stringify(rects);
  if (rects.length && sig !== lastRectsSig) {
    lastRectsSig = sig;
    sendWindowCmd({ rects });
  }
}

function setFocusMode(on) {
  document.body.classList.toggle("focus-mode", on);
  $("focusBtn").setAttribute("aria-pressed", String(on));
  try { localStorage.setItem("lol_hud_focus", on ? "1" : "0"); } catch (_) {}
  syncCardRegions();
}
try { setFocusMode(localStorage.getItem("lol_hud_focus") === "1"); } catch (_) {}
$("focusBtn").addEventListener("click", () => setFocusMode(!document.body.classList.contains("focus-mode")));

// ── OP.GG 스타일 개별 위젯 토글 서랍 ──
$("drawerBtn").addEventListener("click", () => {
  const d = $("widgetDrawer");
  d.hidden = !d.hidden;
  $("drawerBtn").setAttribute("aria-expanded", String(!d.hidden));
  syncCardRegions();
});
document.querySelectorAll("[data-toggle-cls]").forEach((btn) => {
  btn.addEventListener("click", () => {
    const cls = btn.dataset.toggleCls;
    const hiddenNow = document.body.classList.toggle(cls);
    btn.setAttribute("aria-pressed", String(!hiddenNow));
    syncCardRegions();
  });
});

function setMinimized(on) {
  document.body.classList.toggle("minimized", on);
  $("minBtn").setAttribute("aria-expanded", String(!on));
  $("minBtn").textContent = on ? "+" : "−";
  $("miniBar").hidden = !on;
  if (on) {
    const p = $("prob").textContent || "--%";
    const sk = $("nextWhen").textContent || "-";
    $("miniSummary").textContent = `판세 ${p} · ${sk}`;
  }
  syncCardRegions();
}
$("minBtn").addEventListener("click", () => setMinimized(!document.body.classList.contains("minimized")));
$("closeBtn").addEventListener("click", () => {
  sendWindowCmd({ close: true });
  if (BRIDGE_TOKEN) {
    fetch(SHUTDOWN_URL, { method: "POST", headers: controlHeaders(), body: "{}" }).catch(() => {}).finally(() => {
      try { window.close(); } catch (_) {}
    });
  } else {
    try { window.close(); } catch (_) {}
  }
});

(async () => {
  try { ddVersion = (await (await fetch("/meta/champions")).json()).version; } catch (_) { ddVersion = null; }
  await poll();
  if (!bridgeAlive) await runDemo("even", false);
  setInterval(poll, POLL_MS);
})();
