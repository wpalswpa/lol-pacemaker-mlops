<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LoL 페이스메이커</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%23d8b45a'/%3E%3C/svg%3E">
<style>
  /* OP.GG 인게임 스카우터 & AI 코치 플로팅 위젯 HUD (AGENTS.md 3-4절).
     바깥 배경은 완전 투명(transparent), 기본 화면은 ~380x180 컴팩트 모드, 펼침 시 전 라인·전략·빌드 표시.
     창 OS 알파는 230(약 90%) 아래로 내리지 않고 카드 배경 알파(--card-alpha)만 조절해 글자를 항상 불투명하게 유지한다. */
  :root {
    --card-alpha: 0.95;
    --card: rgba(15, 18, 27, var(--card-alpha));
    --card-inner: rgba(24, 29, 43, .82);
    --line: rgba(255, 255, 255, .14);
    --line2: rgba(255, 255, 255, .26);
    --text: #f8fafc;
    --sub: #cbd5e1;
    --dim: #94a3b8;
    --accent: #7c6eff;
    --blue: #5383e8;
    --red-team: #e84057;
    --gold: #fbbf24;
    --cyan: #38e8ff;
    --green: #34d399;
    --yellow: #facc15;
    --red: #fb7185;
  }
  * { box-sizing: border-box; }
  ::-webkit-scrollbar { width: 3px; height: 3px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, .2); border-radius: 99px; }
  html, body {
    margin: 0;
    padding: 0;
    background: transparent !important;
    color: var(--text);
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }
  body {
    font: 11.5px/1.3 -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Segoe UI", sans-serif;
    width: 100%;
    max-width: 380px;
    margin: 0 auto;
    padding: 3px 4px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    overflow-x: hidden;
    text-shadow: 0 1px 2px rgba(0, 0, 0, .85);
  }
  button { font: inherit; color: inherit; cursor: pointer; text-shadow: inherit; }
  button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 1px; }
  .num { font-variant-numeric: tabular-nums; }

  /* 개별 플로팅 다크 글래스 위젯 */
  .hud-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: 0 6px 16px rgba(0, 0, 0, .62);
    backdrop-filter: blur(10px);
  }

  /* ── 위젯 0: 상단 간결 컨트롤 바 (LIVE 배지, ≡, −, ×) ── */
  .top-card { padding: 4px 6px; display: flex; flex-direction: column; gap: 3px; }
  .top { display: flex; align-items: center; gap: 4px; cursor: grab; }
  .top:active { cursor: grabbing; }
  .grip { color: var(--sub); font-size: 11px; font-weight: 900; padding: 0 1px; letter-spacing: -1px; flex: none; }
  .live {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 4px; padding: 3px 7px; border-radius: 6px;
    background: rgba(255, 255, 255, .05); border: 1px solid var(--line); font-weight: 800; font-size: 10.5px;
    text-align: left;
  }
  .live.on { color: var(--green); border-color: rgba(52, 211, 153, .45); background: rgba(52, 211, 153, .11); }
  .live:not(.on) { color: var(--yellow); border-color: rgba(250, 204, 21, .35); }
  .ctrl {
    padding: 3px 7px; border-radius: 6px; border: 1px solid var(--line); background: rgba(255, 255, 255, .06);
    color: var(--sub); font-weight: 800; white-space: nowrap; font-size: 10.5px; flex: none;
  }
  .ctrl:hover { border-color: var(--line2); color: var(--text); }
  .ctrl.active, .ctrl[aria-pressed="true"] {
    border-color: rgba(124, 110, 255, .85); background: rgba(124, 110, 255, .25); color: #efeaff;
  }
  .fx {
    padding: 3px 6px; border-radius: 6px; border: 1px solid rgba(251, 191, 36, .55); background: rgba(251, 191, 36, .16);
    color: var(--gold); font-weight: 800; white-space: nowrap; font-size: 10px;
  }
  .fx[aria-pressed="false"] { border-color: var(--line); background: rgba(255, 255, 255, .04); color: var(--dim); }

  /* ≡ 메뉴 서랍 (집중·이펙트·투명도·위젯 ON/OFF) */
  .opgg-drawer {
    display: flex; flex-direction: column; gap: 6px;
    padding: 7px 8px; margin-top: 2px; border-radius: 8px;
    background: rgba(12, 15, 24, .97); border: 1px solid var(--line2);
  }
  .menu-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
  .sw-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 10px; }
  .sw-row {
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
    font-size: 10.5px; font-weight: 800; color: var(--text); cursor: pointer;
    background: transparent; border: 0; padding: 2px 0; text-align: left;
  }
  .sw-pill {
    width: 24px; height: 13px; border-radius: 99px; background: rgba(255, 255, 255, .18);
    position: relative; flex: none; transition: background .15s;
  }
  .sw-pill::after {
    content: ""; position: absolute; top: 1.5px; left: 2px; width: 10px; height: 10px;
    border-radius: 50%; background: #94a3b8; transition: transform .15s, background .15s;
  }
  .sw-row[aria-pressed="true"] .sw-pill { background: rgba(124, 110, 255, .45); }
  .sw-row[aria-pressed="true"] .sw-pill::after { transform: translateX(10px); background: #8b7cff; }
  body.hide-order #strats { display: none !important; }
  body.hide-sub #briefBox { display: none !important; }
  body.hide-gold .lanes-sec { display: none !important; }
  body.hide-build .build-top, body.hide-build #buy, body.hide-build .compact-buy { display: none !important; }
  body.hide-skill .skill-strip, body.hide-skill .compact-skill { display: none !important; }

  .hk-bar {
    display: flex; justify-content: space-between; align-items: center; gap: 6px; flex-wrap: wrap;
    padding: 0 2px; font-size: 10px; font-weight: 700; color: var(--dim);
  }
  .hk-bar .warn-fs { color: var(--yellow); font-weight: 800; }
  .mini-bar {
    padding: 4px 6px; font-size: 11px; font-weight: 800; color: var(--text);
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }

  /* 기본 접힘 모드(~380x180) vs 펼침 모드 */
  body:not(.expanded) .exp-only { display: none !important; }
  body.expanded .compact-only { display: none !important; }
  body.minimized .win, body.minimized .sec, body.minimized .demo, body.minimized .foot, body.minimized .hk-bar { display: none !important; }
  body.focus-mode .lanes-sec, body.focus-mode #briefBox, body.focus-mode .demo, body.focus-mode .foot,
  body.focus-mode .mrow, body.focus-mode .strat.sub { display: none !important; }

  /* ── 위젯 1: 승률 줄 & 전략 카드 ── */
  .win {
    padding: 6px 8px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    background: linear-gradient(160deg, rgba(20, 25, 40, var(--card-alpha)), rgba(13, 17, 27, var(--card-alpha)));
  }
  .win-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; }
  .win-headline { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
  .prob { font-size: 22px; font-weight: 900; line-height: 1; letter-spacing: -.6px; color: var(--text); }
  .tac {
    display: inline-block; padding: 2px 7px; border-radius: 999px; font-weight: 800; border: 1px solid;
    font-size: 11px;
  }
  .tac.ahead { color: var(--green); border-color: rgba(52, 211, 153, .5); background: rgba(52, 211, 153, .14); }
  .tac.even { color: var(--yellow); border-color: rgba(250, 204, 21, .5); background: rgba(250, 204, 21, .14); }
  .tac.behind { color: var(--red); border-color: rgba(251, 113, 133, .5); background: rgba(251, 113, 133, .14); }
  .exp-btn {
    padding: 2px 7px; border-radius: 6px; border: 1px solid var(--line2); background: rgba(255, 255, 255, .07);
    color: var(--text); font-size: 10.5px; font-weight: 800; flex: none;
  }
  .exp-btn:hover { background: rgba(124, 110, 255, .24); border-color: rgba(124, 110, 255, .7); }

  .chips { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
  .chip {
    font-size: 10.5px; font-weight: 800; padding: 2px 6px; border-radius: 5px;
    background: rgba(255, 255, 255, .07); border: 1px solid var(--line); color: var(--sub);
  }
  .chip.pos { color: var(--green); border-color: rgba(52, 211, 153, .4); background: rgba(52, 211, 153, .12); }
  .chip.neg { color: var(--red); border-color: rgba(251, 113, 133, .4); background: rgba(251, 113, 133, .12); }
  .chip.death { color: #fecdd3; border-color: rgba(251, 113, 133, .45); background: rgba(232, 64, 87, .18); }

  .prob-track {
    height: 4px; width: 100%; border-radius: 99px; background: rgba(232, 64, 87, .35);
    overflow: hidden; position: relative;
  }
  .prob-fill {
    height: 100%; width: 50%; border-radius: 99px;
    background: linear-gradient(90deg, #3b82f6, #38e8ff);
    transition: width .25s ease;
  }
  .stale-msg { color: var(--yellow); font-size: 10.5px; font-weight: 700; }

  /* 순번 ①·② 전략 카드 (잘림 없이 자연 줄바꿈) */
  .strat-list { display: flex; flex-direction: column; gap: 4px; }
  .strat {
    background: var(--card-inner); border: 1px solid var(--line);
    border-radius: 7px; padding: 5px 7px; cursor: pointer;
  }
  .strat.urgent { border-color: rgba(251, 113, 133, .4); background: rgba(251, 113, 133, .1); }
  .strat.gold { border-color: rgba(251, 191, 36, .4); background: rgba(251, 191, 36, .09); }
  .strat.macro { border-color: rgba(52, 211, 153, .4); background: rgba(52, 211, 153, .09); }
  .strat-head { display: flex; align-items: flex-start; gap: 5px; font-size: 11px; font-weight: 800; color: var(--text); }
  .tier-badge {
    display: inline-grid; place-items: center; min-width: 18px; padding: 0 3px; border-radius: 4px;
    font-size: 11px; font-weight: 900; flex: none; text-shadow: none; line-height: 1.3;
  }
  .tier-1 { background: linear-gradient(135deg, #f59e0b, #fbbf24); color: #111827; }
  .tier-2 { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #ffffff; }
  .strat.urgent .tier-1 { background: linear-gradient(135deg, #e11d48, #fb7185); color: #ffffff; }
  .strat-tag {
    font-size: 10px; font-weight: 800; padding: 1px 5px; border-radius: 4px;
    background: rgba(255, 255, 255, .1); color: var(--sub); flex: none;
  }
  .strat-title { flex: 1; min-width: 0; white-space: normal; word-break: keep-all; overflow-wrap: anywhere; }
  .strat-detail {
    margin: 3px 0 0; font-size: 10.5px; color: var(--sub); line-height: 1.35;
    white-space: normal; word-break: keep-all; overflow-wrap: anywhere;
  }
  /* 설명 문단은 눌렀을 때만 펼친다(제목만으로 읽히게, 펼친 HUD 가 Chrome 창 높이 안에 들어가게) */
  .strat:not(.open) .strat-detail { display: none; }

  /* AI 감독 브리핑 (source === "llm" 일 때만 표시) */
  .brief-box {
    display: flex; flex-direction: column; gap: 2px;
    background: rgba(124, 110, 255, .12); border: 1px solid rgba(124, 110, 255, .35);
    border-radius: 7px; padding: 4px 7px;
  }
  .brief-badge {
    display: flex; align-items: center; justify-content: space-between; gap: 4px;
    font-size: 10px; font-weight: 900; color: #ddd6fe;
  }
  .brief-src {
    font-size: 9.5px; font-weight: 800; padding: 0 4px; border-radius: 4px;
    background: rgba(255, 255, 255, .1); color: var(--sub);
  }
  .brief-src.llm { background: rgba(52, 211, 153, .22); color: var(--green); }
  .brief-text {
    margin: 0; font-size: 10.5px; font-weight: 700; color: #f1f5f9; line-height: 1.32;
    white-space: normal; word-break: keep-all; overflow-wrap: anywhere;
  }

  /* ── 공통 위젯 헤더 ── */
  .sec { padding: 6px 8px; }
  .sec-head {
    margin: 0 0 4px; font-size: 11px; color: var(--text); font-weight: 900;
    display: flex; justify-content: space-between; gap: 6px; align-items: center;
  }
  .sec-title { display: flex; align-items: center; gap: 5px; }
  .sec-ico {
    width: 15px; height: 15px; border-radius: 4px; display: inline-grid; place-items: center;
    background: rgba(251, 191, 36, .18); color: var(--gold); font-size: 10px; font-weight: 900; text-shadow: none;
  }
  .sec-head small { color: var(--sub); font-weight: 700; font-size: 10px; }

  /* ── 위젯 2: 아이템 골드 비교 & 라인 스카우터 (P0-1·P1-8·P2-12) ── */
  .tug-hdr {
    display: flex; justify-content: space-between; align-items: center; gap: 4px;
    font-size: 10.5px; font-weight: 800; margin-bottom: 3px;
  }
  .tug-blue { color: #7aa2f7; }
  .tug-red { color: #f7768e; }
  .tug-mid { font-size: 11px; font-weight: 900; }
  .tug-mid.blue-lead { color: #7aa2f7; }
  .tug-mid.red-lead { color: #f7768e; }
  .tug-mid.even-lead { color: var(--gold); }
  .tug-bar {
    height: 3.5px; width: 100%; border-radius: 99px; background: var(--red-team);
    overflow: hidden; margin-bottom: 5px;
  }
  .tug-fill { height: 100%; width: 50%; background: var(--blue); transition: width .25s ease; }

  .lanes { display: flex; flex-direction: column; gap: 2px; }
  .scouter-row {
    display: grid; grid-template-columns: 30px minmax(0, 1fr) minmax(0, 1fr) 46px;
    align-items: center; gap: 4px; padding: 1px 5px; border-radius: 5px;
    background: rgba(255, 255, 255, .04); border: 1px solid rgba(255, 255, 255, .07);
  }
  .scouter-row.unpaired {
    grid-template-columns: 30px minmax(0, 1fr) 54px;
  }
  .scouter-row.me-row {
    border-color: rgba(251, 191, 36, .5);
    background: linear-gradient(90deg, rgba(251, 191, 36, .12), rgba(255, 255, 255, .04));
  }
  .sc-pos { font-size: 9.5px; font-weight: 900; color: var(--dim); text-align: left; }
  .sc-side {
    display: flex; align-items: center; gap: 4px; min-width: 0;
  }
  .ava {
    width: 17px; height: 17px; border-radius: 4px; border: 1px solid var(--line2); background: #161d2e;
    overflow: hidden; display: grid; place-items: center; font-size: 9px; font-weight: 800; color: var(--sub);
    flex: none;
  }
  .ava.me-ava { border-color: var(--gold); }
  .ava img { width: 100%; height: 100%; display: block; object-fit: cover; }
  .sc-name { font-size: 10.5px; font-weight: 700; color: var(--text); word-break: keep-all; }
  .sc-gold { font-size: 10px; font-weight: 800; color: var(--sub); margin-left: auto; flex: none; }
  .sc-unp-tag { font-size: 9.5px; font-weight: 800; color: #f7768e; flex: none; }
  .sc-dead {
    font-size: 9px; font-weight: 900; padding: 0 3px; border-radius: 3px;
    background: rgba(232, 64, 87, .35); color: #fecdd3; flex: none;
  }
  .sc-diff { font-size: 10.5px; font-weight: 900; text-align: right; flex: none; }
  .sc-diff.ahead { color: var(--green); }
  .sc-diff.behind { color: var(--red); }
  .sc-diff.even { color: var(--sub); }

  /* ── 위젯 3: 컴팩트 다음 구매·스킬 줄 (접힘) & 전체 빌드·스킬 위젯 (펼침) ── */
  .compact-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .compact-buy {
    display: flex; align-items: center; gap: 6px; min-width: 0; flex: 1;
  }
  .compact-buy-meta { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .compact-buy-main { font-size: 11px; font-weight: 800; color: var(--gold); word-break: keep-all; }
  .compact-buy-sub { font-size: 10px; font-weight: 700; color: var(--sub); }
  .compact-skill {
    display: flex; align-items: center; gap: 5px; flex: none;
    padding-left: 8px; border-left: 1px solid var(--line);
  }
  .compact-skill-txt { font-size: 11px; font-weight: 900; color: var(--cyan); }

  .build-top {
    display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 6px; flex-wrap: wrap;
  }
  .gold-bar {
    flex: 1; min-width: 120px; font-size: 11px; color: var(--gold); font-weight: 800;
    background: rgba(251, 191, 36, .11); border: 1px solid rgba(251, 191, 36, .32);
    border-radius: 6px; padding: 3px 7px; white-space: normal; word-break: keep-all;
  }
  .mrow { display: flex; align-items: center; gap: 3px; flex: none; }
  .mrow .lab { color: var(--sub); font-size: 10px; font-weight: 800; margin: 0 1px 0 4px; }
  .mrow .lab:first-child { margin-left: 0; }
  .icon {
    width: 24px; height: 24px; border-radius: 5px; border: 1px solid var(--line2); background: #161d2e;
    display: grid; place-items: center; font-size: 9.5px; font-weight: 800; color: var(--sub);
    overflow: hidden; flex: none; position: relative;
  }
  .icon img { width: 100%; height: 100%; display: block; border-radius: 4px; }
  .mrow .icon.owned { opacity: .45; border-color: var(--green); }

  /* 3코어 추천 아이템 가로 슬롯 (P1-7: 배지는 카드 바깥 위쪽, P1-5: 이름 넘치면 아이콘+가격만) */
  .buy { display: grid; grid-template-columns: minmax(0, 1fr) 10px minmax(0, 1fr) 10px minmax(0, 1fr); align-items: end; gap: 2px; }
  .buy .arr { color: var(--sub); font-weight: 900; font-size: 9px; text-align: center; padding-bottom: 12px; }
  .buy-slot { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .slot-badge {
    min-height: 14px; font-size: 9.5px; font-weight: 900; text-align: center; border-radius: 4px;
    padding: 0 4px; line-height: 14px; text-shadow: none;
  }
  .slot-badge.now { background: var(--gold); color: #171102; }
  .slot-badge.own { background: #143628; color: var(--green); border: 1px solid rgba(52, 211, 153, .45); }
  .slot-badge.empty { visibility: hidden; }
  .card {
    width: 100%; min-width: 0;
    display: flex; align-items: center; gap: 4px;
    background: var(--card-inner); border: 1.5px solid var(--line);
    border-radius: 7px; padding: 4px 5px; text-align: left;
  }
  .card.icon-only { justify-content: center; gap: 5px; }
  .card .icon { width: 24px; height: 24px; border-radius: 5px; flex: none; }
  .card-info { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 1px; }
  .card.icon-only .card-info { flex: 0 1 auto; }
  .card .nm { font-size: 10.5px; font-weight: 800; white-space: nowrap; color: var(--text); }
  .card .gd { color: var(--gold); font-size: 10px; font-weight: 800; line-height: 1.1; }
  .card.owned { opacity: .55; }

  .now-buy {
    border-color: var(--gold); box-shadow: 0 0 8px rgba(251, 191, 36, .45);
    animation: pulseGold 1.3s ease-in-out infinite;
  }
  .now-skill {
    border-color: var(--cyan) !important; box-shadow: 0 0 8px rgba(56, 232, 255, .55);
    animation: pulseCyan 1.3s ease-in-out infinite;
  }
  @keyframes pulseGold { 50% { box-shadow: 0 0 2px var(--gold), 0 0 4px rgba(251, 191, 36, .2); } }
  @keyframes pulseCyan { 50% { box-shadow: 0 0 2px var(--cyan), 0 0 4px rgba(56, 232, 255, .2); } }
  body.fx-off .now-buy { animation: none; box-shadow: none; border-color: var(--line); }
  body.fx-off .now-skill { animation: none; box-shadow: none; border-color: var(--line) !important; }
  @media (prefers-reduced-motion: reduce) { .now-buy, .now-skill { animation: none; } }

  /* 스킬 추천 바 */
  .skill-strip {
    margin-top: 6px; padding-top: 5px; border-top: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
  }
  .skill-left { display: flex; align-items: center; gap: 6px; min-width: 0; flex: 1; flex-wrap: wrap; }
  .skill-title { font-size: 11px; font-weight: 900; color: var(--text); }
  .skill-lv { color: var(--sub); font-size: 10.5px; font-weight: 800; }
  .skill-when { color: var(--cyan); font-size: 11px; font-weight: 900; }
  .key {
    display: inline-grid; place-items: center; width: 21px; height: 21px; border-radius: 5px;
    font: 900 11.5px/1 ui-monospace, Menlo, Consolas, monospace;

function skillPlan(order) {
  const keys = order ? order.split(">").map((s) => s.trim()) : [];
  const count = Object.fromEntries(keys.map((k) => [k, 0]));
  const plan = [];
  for (let lv = 1; lv <= 18; lv++) {
    if (lv === 6 || lv === 11 || lv === 16) { plan.push("R"); continue; }
    const cap = Math.min(Math.floor((lv + 1) / 2), 5);
    const pick = keys.find((k) => (lv <= 3 ? count[k] === 0 : count[k] < cap)) || null;
    if (pick) count[pick] += 1;
    plan.push(pick);
  }
  return plan;
}

const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const mmss = (t) => { const s = Math.max(0, Math.floor(t || 0)); return `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`; };

function icon(item) {
  const box = el("span", "icon");
  if (ddVersion && Number.isInteger(item.item_id)) {
    const img = new Image();
    img.alt = item.name; img.loading = "lazy";
    img.dataset.fb = item.name.slice(0, 2);
    img.src = `https://ddragon.leagueoflegends.com/cdn/${encodeURIComponent(ddVersion)}/img/item/${item.item_id}.png`;
    box.append(img);
  } else box.textContent = item.name.slice(0, 2);
  return box;
}
document.addEventListener("error", (e) => {
  const img = e.target;
  if (img instanceof HTMLImageElement && img.dataset.fb != null) { const p = img.parentElement; p.textContent = img.dataset.fb; }
}, true);

function miniRow(target, items, owned) {
  target.replaceChildren(...items.slice(0, 3).map((it) => {
    const own = owned.has(it.item_id);
    const m = icon(it);
    if (own) m.classList.add("owned");
    m.title = `${it.name} ${it.gold}G · ${it.why}${own ? " · ✓ 보유 완료" : ""}`;
    m.setAttribute("aria-label", m.title);
    return m;
  }));
}

function stratTone(cat) {
  if (/수성|영혼 저지|부활|템포 조절|위협|바론 수성/.test(cat)) return "urgent";
  if (/귀환|골드|파워/.test(cat)) return "gold";
  if (/오브젝트|수적 우위|바론 운영|영혼 확정|스노우볼|전 라인/.test(cat)) return "macro";
  return "";
}

  const ava = el("div", "ava" + (isMe ? " me-ava" : ""));
  const cid = p && p.champion_id;
  const name = (p && p.champion) || "-";
  if (ddVersion && cid && /^[A-Za-z0-9_]+$/.test(cid)) {
    const img = document.createElement("img");
    img.src = `https://ddragon.leagueoflegends.com/cdn/${ddVersion}/img/champion/${cid}.png`;
    img.alt = name;
    img.onerror = () => { img.remove(); ava.textContent = name.slice(0, 2); };
    ava.append(img);
  } else {
    ava.textContent = name.slice(0, 2);
  }
  return ava;
}

}

    ? s.team_gold.ally
    : allLanes.reduce((acc, ln) => acc + ((ln.ally && ln.ally.item_gold) || 0), 0);

    ? s.team_gold.enemy
    : allLanes.reduce((acc, ln) => acc + ((ln.enemy && ln.enemy.item_gold) || 0), 0);

  const enemyTeamName = mySide === "red" ? "블루" : "레드";

  $("blueGoldTxt").textContent = `${allyTeamName} ${allyGold.toLocaleString()}G`;
  $("redGoldTxt").textContent = `${enemyTeamName} ${enemyGold.toLocaleString()}G`;
  const diffEl = $("diffGoldTxt");
  if (rawDiff > 0) {
    diffEl.textContent = `${allyTeamName} +${rawDiff.toLocaleString()}G`;
    diffEl.className = "tug-mid blue-lead";
  } else if (rawDiff < 0) {
    diffEl.textContent = `${enemyTeamName} +${Math.abs(rawDiff).toLocaleString()}G`;
    diffEl.className = "tug-mid red-lead";
  } else {
    diffEl.textContent = "동률 0G";
    diffEl.className = "tug-mid even-lead";
  }
  const totalG = allyGold + enemyGold;
  const bluePct = totalG > 0 ? Math.max(12, Math.min(88, Math.round((allyGold / totalG) * 100))) : 50;
  $("tugFill").style.width = `${bluePct}%`;

  const rows = allLanes.map((ln) => {
    const a = ln.ally || {};
    const e = ln.enemy || {};
    const aValid = a.champion && a.champion !== "미확인";
    const eValid = e.champion && e.champion !== "미확인";
    const posTag = POS_SHORT[ln.position] || "VS";

    // P2-12: 아군이 없는 줄(unpaired)은 상대만 한 줄로 축약
    if (ln.status === "unpaired" || (!aValid && eValid)) {
      const row = el("div", "scouter-row unpaired");
      row.title = `${ln.lane_ko}: 상대 ${e.champion || "-"}(${e.kda || "-"}, CS ${e.cs || 0})`;
      const side = el("div", "sc-side");
      side.append(el("span", "sc-unp-tag", "상대"), makeAvatar(e, false), el("span", "sc-name", e.champion || "-"));
      if (e.is_dead && e.respawn_timer > 0) side.append(el("span", "sc-dead num", `${Math.round(e.respawn_timer)}s`));
      row.append(
        el("span", "sc-pos", posTag),
        side,
        el("span", "sc-diff num even", `${(e.item_gold || 0).toLocaleString()}G`),
      );
      return row;
    }

    const row = el("div", "scouter-row" + (ln.is_me ? " me-row" : ""));
    row.title = `${ln.lane_ko}: ${a.champion || "-"}(${a.kda || "-"}, CS ${a.cs || 0}) vs ${e.champion || "-"}(${e.kda || "-"}, CS ${e.cs || 0})`;

    const left = el("div", "sc-side");
    if (aValid) {
      left.append(makeAvatar(a, ln.is_me), el("span", "sc-name", a.champion));
      if (a.is_dead && a.respawn_timer > 0) left.append(el("span", "sc-dead num", `${Math.round(a.respawn_timer)}s`));
      left.append(el("span", "sc-gold num", `${(a.item_gold || 0).toLocaleString()}G`));
    }

    const right = el("div", "sc-side");
    if (eValid) {
      right.append(makeAvatar(e, false), el("span", "sc-name", e.champion));
      if (e.is_dead && e.respawn_timer > 0) right.append(el("span", "sc-dead num", `${Math.round(e.respawn_timer)}s`));
      right.append(el("span", "sc-gold num", `${(e.item_gold || 0).toLocaleString()}G`));
    }

    // P2-12: 라벨(POS)과 차이를 분리해 차이는 오른쪽 열에 초록/빨강 색으로만 표시
    const gd = (a.item_gold || 0) - (e.item_gold || 0);
    const dTxt = gd === 0 ? "0G" : `${gd > 0 ? "+" : "-"}${Math.abs(gd) >= 1000 ? (Math.round(Math.abs(gd) / 100) / 10) + "k" : Math.abs(gd) + "G"}`;
    const diffCls = gd > 0 ? "ahead" : (gd < 0 ? "behind" : "even");
    row.append(el("span", "sc-pos", posTag), left, right, el("span", `sc-diff num ${diffCls}`, dTxt));
    return row;
  });
  boxEl.replaceChildren(...rows);
}

function fitItemCards() {
  // P1-5: 아이템 이름이 넘치면 아이콘과 가격만 보여 준다
  document.querySelectorAll("#buy .card").forEach((card) => {
    const nm = card.querySelector(".nm");
    if (!nm) return;
    nm.hidden = false;
    card.classList.remove("icon-only");
    if (nm.scrollWidth > nm.clientWidth + 1 || card.scrollWidth > card.clientWidth + 1) {
      nm.hidden = true;
      card.classList.add("icon-only");
    }
  });
}

function briefOverlapsPrimary(text, strategy) {
  const s1 = strategy && strategy.strategies && strategy.strategies[0];
  if (!text || !s1) return false;
  const norm = (v) => String(v || "").replace(/\s+/g, "").trim();
  const bt = norm(text);
  const t1 = norm(s1.title);
  const d1 = norm(s1.detail);
  return Boolean((t1 && bt.includes(t1)) || (d1 && bt.includes(d1)));
}

  if (!view || !view.strategy) return;
  const s = view.strategy, b = s.build_advice;

    card.append(head, el("p", "strat-detail", st.detail));

    card.addEventListener("click", () => {

      else openStratCats.delete(st.category);

    });
    return card;

  $("strats").replaceChildren(...stratNodes);
  $("demoBar").hidden = live;

  // 빌드·스킬 추천 (P1-5 short 필드, P1-7 배지 카드 바깥 위쪽)

  $("compactBuyMain").textContent = recShort;
  $("compactBuySub").textContent = targetItem ? `${targetItem.gold.toLocaleString()}G${curGold ? " · 보유 " + curGold : ""}` : (curGold ? `보유 ${curGold}` : "");
  const skillShort = view.next ? `${view.when === "next_level" ? "다음" : "지금"} ${view.next}` : "스킬 대기";
  $("compactSkillTxt").textContent = skillShort;
  $("compactSkillKey").replaceChildren(...(view.next ? [el("span", "key now-skill", view.next)] : []));

  $("buy").replaceChildren(...items.flatMap((it, idx) => {
    const own = isItemOwned(it, view.owned), now = it === nextBuy;
    const slot = el("div", "buy-slot");
    const badge = el("span", "slot-badge " + (own ? "own" : (now ? "now" : "empty")), own ? "✓ 보유 완료" : (now ? "지금 구매 추천" : "·"));
    const card = el("button", "card" + (own ? " owned" : "") + (now ? " now-buy" : ""));
    card.type = "button"; card.dataset.item = String(it.item_id);
    card.setAttribute("aria-pressed", String(own));
    card.title = `${it.name} ${it.gold}G · ${it.why}`;

    const info = el("div", "card-info");

    card.append(icon(it), info);
    slot.append(badge, card);
    return idx ? [el("span", "arr", "▶"), slot] : [slot];
  }));
  fitItemCards();

  // 스킬 추천 바
  const order = b.skill_order.order;
  $("lv").textContent = view.level ? `Lv ${view.level}` : "";
  $("nextWhen").textContent = skillShort;
  $("nextWhen").title = b.tactical_tip || b.skill_order.focus || "";
  const keys = order ? order.split(">").map((k) => k.trim()) : (view.next ? [view.next] : []);
  $("keys").replaceChildren(...keys.flatMap((k, i) => {
    const isNext = k === view.next;
    const cap = el("span", "key" + (isNext ? " now-skill" : " off"), k);
    return i ? [el("span", null, "▶"), cap] : [cap];
  }));

  // Windows HUD 상태 표시
  const hw = view.hudWindow;
  if (hw) {

    const lolLabel = hw.lol_detected ? "LoL 추적 중" : "F9 숨김";
    $("hkHint").textContent = `${ctLabel} · ${lolLabel}`;
    const fsWarn = typeof hw.lol_window_mode_warning === "boolean"
      ? hw.lol_window_mode_warning
      : (hw.lol_window_mode === "fullscreen");
    $("fsWarn").hidden = !fsWarn;
  }

  $("foot").textContent = `모델 ${s.model_version || "-"} · 실시간 종합 전략`;
  // P0-4: source !== "llm" 이면 브리핑 칸 숨김
  if (lastBriefSource !== "llm") {
    $("briefBox").hidden = true;
  }
  requestBriefing(s, view.ctx);
  document.querySelectorAll("[data-demo]").forEach((btn) => btn.setAttribute("aria-pressed", String(view.mode === "demo" && btn.dataset.demo === view.demo)));
  syncCardRegions();
}

// ── AI 감독 전략 브리핑 (P0-4: source === "llm" 이고 1순위 카드와 겹치지 않을 때만 표시) ──
const openStratCats = new Set();
let briefKey = null, briefBusy = false, lastBriefAt = 0, lastBriefSource = "dynamic_rule";
function briefingKey(s) {
  const b = s.build_advice;
  const laneSig = (s.lanes || []).map((l) => `${l.position}:${l.status}`);
  const stSig = (s.strategies || []).slice(0, 2).map((x) => x.category);
  return JSON.stringify([s.phase, s.state, b.my_champion, laneSig, stSig, Math.round(s.win_prob * 50)]);
}
async function requestBriefing(s, ctx) {
  const key = briefingKey(s);
  const now = Date.now();
  if (!ctx || briefBusy || key === briefKey) return;
  if (lastBriefAt && (now - lastBriefAt) < BRIEF_MIN_MS) return;
  const reqMode = view ? view.mode : null;
  const reqDemo = view ? view.demo : null;
  briefBusy = true; briefKey = key; lastBriefAt = now;
  try {
    const res = await fetch("/strategy/briefing", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(ctx) });
    if (!res.ok) throw new Error(String(res.status));
    const r = await res.json();
    if (!view || view.mode !== reqMode || (reqMode === "demo" && view.demo !== reqDemo)) return;
    const llm = r.source === "llm";
    lastBriefSource = llm ? "llm" : "dynamic_rule";
    $("briefText").textContent = r.briefing;
    $("briefText").title = r.briefing || "";
    $("briefSrc").textContent = llm ? `LLM · ${r.llm_model}` : "동적 전략";
    $("briefSrc").className = llm ? "brief-src llm" : "brief-src";
    const dup = briefOverlapsPrimary(r.briefing, view.strategy);
    $("briefBox").hidden = !(llm && r.briefing && !dup);
    syncCardRegions();
  } catch (_) {
    if (!view || view.mode !== reqMode || (reqMode === "demo" && view.demo !== reqDemo)) return;
    lastBriefSource = "dynamic_rule";
    $("briefText").textContent = "브리핑 없음";
    $("briefSrc").textContent = "동적 전략";
    $("briefBox").hidden = true;
    briefKey = null;
    syncCardRegions();
  } finally {
    lastBriefAt = Date.now();
    briefBusy = false;
  }
}

$("buy").addEventListener("click", (e) => {
  const card = e.target.closest("[data-item]");
  if (!card || !view) return;
  const id = Number(card.dataset.item);
  view.owned.has(id) ? view.owned.delete(id) : view.owned.add(id);
  render();
});

// ── Win32·macOS Swift·Electron 인게임 팝업 제어 ──
function controlHeaders() {
  const h = { "Content-Type": "application/json" };
  if (BRIDGE_TOKEN) h["X-Bridge-Token"] = BRIDGE_TOKEN;
  return h;
}
function sendWindowCmd(cmd) {
  try {
    if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.macHud) {
      window.webkit.messageHandlers.macHud.postMessage(cmd);
    }
  } catch (_) {}
  if (/Electron/i.test(navigator.userAgent)) {
    console.debug("__HUD_CMD__:" + JSON.stringify(cmd));
  }
  if (!BRIDGE_TOKEN) return;
  fetch(WINDOW_URL, { method: "POST", headers: controlHeaders(), body: JSON.stringify(cmd) }).catch(() => {});
}

if (/Electron/i.test(navigator.userAgent)) {
  let passThrough = false;
  window.addEventListener("mousemove", (e) => {
    const onWidget = !!e.target.closest(".hud-card, .demo, button");
    const wantPass = !onWidget;
    if (wantPass !== passThrough) {
      passThrough = wantPass;
      console.debug(passThrough ? "__HUD_PASSTHROUGH__:1" : "__HUD_PASSTHROUGH__:0");
    }
  });
}

let dragStart = null;
$("dragBar").addEventListener("mousedown", (e) => {
  if (e.target.closest("button")) return;
  dragStart = { x: e.screenX, y: e.screenY };
});
window.addEventListener("mouseup", (e) => {
  if (!dragStart) return;
  const dx = Math.round(e.screenX - dragStart.x);
  const dy = Math.round(e.screenY - dragStart.y);
  dragStart = null;
  if (Math.abs(dx) > 4 || Math.abs(dy) > 4) sendWindowCmd({ dx, dy });
});

// ── 데모 ──
async function runDemo(name, lock) {
  const d = DEMOS[name];
  try {
    const res = await fetch("/strategy", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(d.ctx) });
    if (!res.ok) throw new Error(`서버 ${res.status}`);
    const strat = await res.json();
    if (lock) demoLock = true;
    if (!lock && (demoLock || (bridgeAlive && lastLive))) return;
    const b = strat.build_advice;
    const owned = new Set([...(d.ctx.me.items || []), ...b.recommended_items.slice(0, d.ownedSteps).map((i) => i.item_id)].filter(Number.isInteger));
    const plan = skillPlan(b.skill_order.order);
    view = { mode: "demo", demo: name, t: d.t, strategy: strat, ctx: d.ctx, owned, level: d.level, next: plan[d.level - 1], when: "now", hudWindow: lastLive ? lastLive.hud_window : null };
    lastBriefAt = 0;
    lastBriefSource = "dynamic_rule";
    $("briefBox").hidden = true;
    render();
  } catch (err) {
    $("briefText").textContent = `서버에 연결하지 못했어요 (${err.message})`;
  }
}
document.querySelectorAll("[data-demo]").forEach((btn) => btn.addEventListener("click", () => runDemo(btn.dataset.demo, true)));

// ── 브리지 폴링 (H8: /strategy 없을 때 /coach 최소 폴백) ──
function coachFallbackView(st) {

      phase: "mid",

      state: b.state,

      tactical_badge_short: stKo,

      team_gold: { ally: 0, enemy: 0 },
      team_gold_diff: 0,
      alive: { ally: 5, enemy: 5 },

      lanes: [],

    when: st.next_skill_when,

  };
}
function applyLive(st) {
  if (!st.strategy && st.coach) {
    view = coachFallbackView(st);
    render();
    return;
  }
  view = {
    mode: "live",
    t: st.game_time_sec,
    strategy: st.strategy,
    ctx: st.live_context,
    owned: new Set((st.owned_items || []).map((i) => i.itemID)),
    level: st.level,
    next: st.next_skill,
    when: st.next_skill_when,
    hudWindow: st.hud_window || null,
    stale: !!st.strategy_error,
  };
  render();
}
async function poll() {
  try {
    const res = await fetch(BRIDGE_URL, { cache: "no-store" });
    const st = await res.json();
    if (st.hud_window && view) view.hudWindow = st.hud_window;
    bridgeAlive = !!(st.connected && (st.strategy || st.coach));
    if (bridgeAlive) { lastLive = st; if (!demoLock) applyLive(st); }
    else if (view && view.mode === "live") { view.mode = "demo"; render(); }
  } catch (_) {
    bridgeAlive = false;
    if (view && view.mode === "live") { view.mode = "demo"; render(); }
  }
}
$("live").addEventListener("click", () => {
  demoLock = false;
  if (bridgeAlive && lastLive) applyLive(lastLive);
});

// ── P1-6: 투명도 (카드 배경 알파 --card-alpha 만 변경, OS 창 알파는 항상 230/255 이상 유지) ──
const OPAC_STEPS = [0.95, 0.82, 0.68];

}
applyOpac(true);
$("opac").addEventListener("click", () => {
  opacIdx = (opacIdx + 1) % OPAC_STEPS.length;
  applyOpac(false);
  try { localStorage.setItem("lol_hud_opac", String(OPAC_STEPS[opacIdx])); } catch (_) {}
});

let lastRectsSig = "";
function syncCardRegions() {
  const rects = [];
  for (const card of document.querySelectorAll(".hud-card, .demo button")) {
    if (card.hidden || card.offsetParent === null) continue;
    const r = card.getBoundingClientRect();
    if (r.width > 0 && r.height > 0) {
      rects.push([Math.max(0, Math.floor(r.left)), Math.max(0, Math.floor(r.top)), Math.ceil(r.width), Math.ceil(r.height)]);
    }
  }
  const height = Math.max(120, Math.ceil(document.body.scrollHeight) + 12);
  const sig = JSON.stringify([rects, height]);
  if (rects.length && sig !== lastRectsSig) {
    lastRectsSig = sig;
    sendWindowCmd({ rects, height });
  }
}

// ── P2-11: 기본 접힘(~380x180) / 펼침 토글 (localStorage 에 기억, 실패해도 동작) ──
function setExpanded(on) {
  document.body.classList.toggle("expanded", on);
  $("expandBtn").setAttribute("aria-expanded", String(on));
  $("expandBtn").textContent = on ? "접기 ▴" : "상세 ▾";
  try { localStorage.setItem("lol_hud_expanded", on ? "1" : "0"); } catch (_) {}
  if (on) fitItemCards();
  syncCardRegions();
}
let expSaved = false;
try { expSaved = localStorage.getItem("lol_hud_expanded") === "1"; } catch (_) {}
setExpanded(expSaved);
$("expandBtn").addEventListener("click", () => setExpanded(!document.body.classList.contains("expanded")));

function setFocusMode(on) {
  document.body.classList.toggle("focus-mode", on);
  $("focusBtn").setAttribute("aria-pressed", String(on));
  try { localStorage.setItem("lol_hud_focus", on ? "1" : "0"); } catch (_) {}
  syncCardRegions();
}
try { setFocusMode(localStorage.getItem("lol_hud_focus") === "1"); } catch (_) {}
$("focusBtn").addEventListener("click", () => setFocusMode(!document.body.classList.contains("focus-mode")));

// ── ≡ 메뉴 서랍 토글 ──
$("drawerBtn").addEventListener("click", () => {
  const d = $("widgetDrawer");
  d.hidden = !d.hidden;
  $("drawerBtn").setAttribute("aria-expanded", String(!d.hidden));
  syncCardRegions();
});
document.querySelectorAll("[data-toggle-cls]").forEach((btn) => {
  btn.addEventListener("click", () => {
    const cls = btn.dataset.toggleCls;
    const hiddenNow = document.body.classList.toggle(cls);
    btn.setAttribute("aria-pressed", String(!hiddenNow));
    syncCardRegions();
  });
});

function setMinimized(on) {
  document.body.classList.toggle("minimized", on);
  $("minBtn").setAttribute("aria-expanded", String(!on));
  $("minBtn").textContent = on ? "+" : "−";
  $("miniBar").hidden = !on;
  if (on) {
    const p = $("prob").textContent || "--%";
    const sk = $("compactSkillTxt").textContent || "-";
    $("miniSummary").textContent = `판세 ${p} · ${sk}`;
  }
  syncCardRegions();
}
$("minBtn").addEventListener("click", () => setMinimized(!document.body.classList.contains("minimized")));
$("closeBtn").addEventListener("click", () => {
  sendWindowCmd({ close: true });
  if (BRIDGE_TOKEN) {
    fetch(SHUTDOWN_URL, { method: "POST", headers: controlHeaders(), body: "{}" }).catch(() => {}).finally(() => {
      try { window.close(); } catch (_) {}
    });
  } else {
    try { window.close(); } catch (_) {}
  }
});

(async () => {
  try { ddVersion = (await (await fetch("/meta/champions")).json()).version; } catch (_) { ddVersion = null; }
  await poll();
  if (!bridgeAlive) await runDemo("even", false);
  setInterval(poll, POLL_MS);
})();
</script>
