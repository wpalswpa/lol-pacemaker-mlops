<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LoL 페이스메이커</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%23d8b45a'/%3E%3C/svg%3E">
<style>
  /* OP.GG 영감 인게임 글래스 HUD (AGENTS.md 3-4절). 계산은 서버 /strategy 가 담당하고 화면은 결과만 옮긴다 */
  :root {
    --bg: #080b12; --card: rgba(15, 20, 32, .86); --card2: rgba(22, 29, 46, .88);
    --line: rgba(255, 255, 255, .09); --line2: rgba(255, 255, 255, .15);
    --text: #f3f6fc; --sub: #9fb0c8; --dim: #667894;
    --accent: #7c6eff; --gold: #f5c451; --cyan: #38e8ff; --green: #34d399; --yellow: #fbbf24; --red: #fb7185;
  }
  * { box-sizing: border-box; }
  ::-webkit-scrollbar { width: 3px; height: 3px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, .16); border-radius: 99px; }
  html, body { margin: 0; background: var(--bg); color: var(--text); user-select: none; }
  body { font: 11px/1.32 -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif;
         max-width: 420px; min-height: 100vh; margin: 0 auto; padding: 5px 6px 6px;
         display: flex; flex-direction: column; gap: 5px; overflow-x: hidden;
         background: radial-gradient(circle at 12% 0%, rgba(124, 110, 255, .15), transparent 46%),
                     radial-gradient(circle at 92% 10%, rgba(56, 232, 255, .08), transparent 42%), var(--bg);
         border: 1px solid rgba(124, 110, 255, .28); border-radius: 12px; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 1px; }
  .num { font-variant-numeric: tabular-nums; }

  /* 상단 바 */
  .top { display: flex; align-items: center; gap: 3px; cursor: grab; }
  .top:active { cursor: grabbing; }
  .grip { color: var(--dim); font-size: 10px; padding: 0 1px; letter-spacing: -1px; flex: none; }
  .live { flex: 1; min-width: 0; display: flex; align-items: center; gap: 4px; padding: 4px 7px; border-radius: 8px;
          background: var(--card); border: 1px solid var(--line); font-weight: 700; font-size: 10.5px;
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; }
  .live.on { color: var(--green); border-color: rgba(52, 211, 153, .3); }
  .live:not(.on) { color: var(--yellow); }
  .fx { padding: 4px 5px; border-radius: 7px; border: 1px solid rgba(245, 196, 81, .5); background: rgba(245, 196, 81, .12);
        color: var(--gold); font-weight: 700; white-space: nowrap; font-size: 9.5px; }
  .fx[aria-pressed="false"] { border-color: var(--line); background: var(--card); color: var(--dim); }
  .ctrl { padding: 4px 5px; border-radius: 7px; border: 1px solid var(--line); background: var(--card);
          color: var(--sub); font-weight: 700; white-space: nowrap; font-size: 9.5px; }
  .ctrl:hover { border-color: var(--line2); color: var(--text); }
  .ctrl.active, .ctrl[aria-pressed="true"] { border-color: rgba(124, 110, 255, .7); background: rgba(124, 110, 255, .18); color: #dcd7ff; }

  .hk-bar { display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 0 3px; font-size: 9px; color: var(--dim); }
  .hk-bar .warn-fs { color: var(--yellow); font-weight: 700; }
  .mini-bar { background: var(--card); border: 1px solid var(--line); border-radius: 9px; padding: 6px 10px;
              font-weight: 700; color: var(--text); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  body.minimized .win, body.minimized .sec, body.minimized .demo, body.minimized .foot, body.minimized .hk-bar { display: none !important; }
  body.minimized { min-height: 0; }
  body.focus-mode .lanes-sec, body.focus-mode .brief-sec, body.focus-mode .demo, body.focus-mode .foot,
  body.focus-mode .mrow, body.focus-mode .strat.sub, body.focus-mode .tip { display: none !important; }
  body.focus-mode { min-height: 0; }

  /* 판세 히어로 바 (한눈에 보는 승률 + 핵심 수치) */
  .win { background: linear-gradient(135deg, rgba(20, 27, 45, .92), rgba(13, 18, 30, .88));
         border: 1px solid var(--line); border-radius: 10px; padding: 7px 9px;
         display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; align-items: center; }
  .win .t { grid-column: 1 / -1; color: var(--sub); font-size: 9.5px; display: flex; justify-content: space-between; gap: 6px; }
  .win .t b { color: var(--text); font-weight: 800; letter-spacing: -.2px; }
  .prob { font-size: 28px; font-weight: 900; line-height: .95; letter-spacing: -1px; }
  .tac { justify-self: start; padding: 2px 8px; border-radius: 999px; font-weight: 800; border: 1px solid; font-size: 10px; }
  .tac.ahead { color: var(--green); border-color: rgba(52, 211, 153, .45); background: rgba(52, 211, 153, .12); }
  .tac.even { color: var(--yellow); border-color: rgba(251, 191, 36, .45); background: rgba(251, 191, 36, .12); }
  .tac.behind { color: var(--red); border-color: rgba(251, 113, 133, .45); background: rgba(251, 113, 133, .12); }
  .chips { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { font-size: 9.5px; font-weight: 700; padding: 2px 6px; border-radius: 6px;
          background: rgba(255, 255, 255, .04); border: 1px solid var(--line); color: var(--sub); }
  .chip.pos { color: var(--green); border-color: rgba(52, 211, 153, .3); background: rgba(52, 211, 153, .08); }
  .chip.neg { color: var(--red); border-color: rgba(251, 113, 133, .3); background: rgba(251, 113, 133, .08); }
  .stale-msg { grid-column: 1 / -1; color: var(--yellow); font-size: 9.5px; }

  .sec { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; }
  .sec h2 { margin: 0 0 5px; font-size: 9.5px; color: var(--sub); font-weight: 800; letter-spacing: .2px;
            display: flex; justify-content: space-between; gap: 6px; align-items: center; }
  .sec h2 small { color: var(--dim); font-weight: 600; font-size: 9px; }

  /* OP.GG 스타일 초상화 전 라인 골드 스트립 */
  .lanes { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
  .lane { background: rgba(255, 255, 255, .03); border: 1px solid var(--line); border-radius: 8px; padding: 4px 2px 3px;
          text-align: center; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .lane.ahead { border-color: rgba(52, 211, 153, .45); background: rgba(52, 211, 153, .06); }
  .lane.even { border-color: rgba(255, 255, 255, .1); }
  .lane.behind { border-color: rgba(251, 113, 133, .45); background: rgba(251, 113, 133, .06); }
  .lane.unconfirmed { opacity: .62; }
  .lane .ln { font-size: 8.5px; color: var(--dim); font-weight: 800; line-height: 1; }
  .lane .ava { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line2); background: #161d2e;
               overflow: hidden; display: grid; place-items: center; font-size: 8px; font-weight: 800; color: var(--sub); }
  .lane .ava img { width: 100%; height: 100%; display: block; object-fit: cover; }
  .lane .ch { font-size: 9px; font-weight: 700; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lane .gd { font-size: 9px; font-weight: 800; line-height: 1; }
  .lane.ahead .gd { color: var(--green); }
  .lane.even .gd { color: var(--sub); }
  .lane.behind .gd { color: var(--red); }

  /* 한눈에 읽히는 전략 콜 (1순위 배너 + 2·3순위 1줄 칩) */
  .strat-list { display: flex; flex-direction: column; gap: 4px; }
  .strat { background: rgba(255, 255, 255, .035); border: 1px solid var(--line); border-left: 3px solid var(--accent);
           border-radius: 8px; padding: 5px 8px; }
  .strat.urgent { border-left-color: var(--red); background: rgba(251, 113, 133, .07); }
  .strat.gold { border-left-color: var(--gold); background: rgba(245, 196, 81, .07); }
  .strat.macro { border-left-color: var(--green); background: rgba(52, 211, 153, .07); }
  .strat.sub { padding: 4px 7px; cursor: pointer; }
  .strat.sub .strat-detail { display: none; }
  .strat.sub.open .strat-detail { display: block; }
  .strat-head { display: flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 800; color: var(--text); }
  .strat.sub .strat-head { font-size: 10px; font-weight: 700; }
  .strat-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .strat.main .strat-title { white-space: normal; }
  .strat-tag { font-size: 8.5px; font-weight: 800; padding: 1px 5px; border-radius: 5px;
               background: rgba(124, 110, 255, .2); color: #cfc9ff; flex: none; }
  .strat.urgent .strat-tag { background: rgba(251, 113, 133, .2); color: var(--red); }
  .strat.gold .strat-tag { background: rgba(245, 196, 81, .2); color: var(--gold); }
  .strat.macro .strat-tag { background: rgba(52, 211, 153, .2); color: var(--green); }
  .strat-detail { margin: 2px 0 0; font-size: 9.5px; color: var(--sub); line-height: 1.35; overflow-wrap: anywhere; }

  /* OP.GG 스타일 컴팩트 빌드 [아이콘]▶[아이콘]▶[아이콘] + 스킬 인라인 */
  .gold-bar { font-size: 10px; color: var(--gold); margin-bottom: 5px; font-weight: 800; overflow-wrap: anywhere; }
  .icon { width: 22px; height: 22px; border-radius: 5px; border: 1px solid var(--line2); background: #161d2e;
          display: grid; place-items: center; font-size: 8px; color: var(--sub); overflow: hidden; flex: none; }
  .icon img { width: 100%; height: 100%; display: block; }
  .mrow { display: flex; align-items: center; gap: 3px; flex-wrap: wrap; margin-bottom: 5px; }
  .mrow .lab { color: var(--dim); font-size: 9px; font-weight: 700; margin: 0 2px 0 5px; }
  .mrow .lab:first-child { margin-left: 0; }
  .mrow .icon { position: relative; overflow: visible; }
  .mrow .icon img { border-radius: 4px; }
  .mrow .icon.owned { opacity: .4; }
  .mrow .icon .ck { position: absolute; right: -4px; bottom: -4px; width: 12px; height: 12px; border-radius: 50%; background: var(--green);
                    color: #06140d; font-size: 8px; font-weight: 900; display: grid; place-items: center; }

  .buy { display: flex; align-items: center; gap: 4px; margin-top: 4px; }
  .buy .arr { color: var(--dim); font-weight: 900; font-size: 9px; flex: none; }
  .card { position: relative; flex: 1; min-width: 0; background: rgba(255, 255, 255, .035); border: 1.5px solid var(--line);
          border-radius: 9px; padding: 7px 3px 4px; text-align: center; }
  .card .icon { width: 28px; height: 28px; margin: 0 auto 2px; border-radius: 6px; }
  .card .nm { font-size: 9.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .gd { color: var(--gold); font-size: 9px; font-weight: 700; }
  .card .badge { position: absolute; top: -7px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 8px; font-weight: 900;
                 padding: 1px 5px; border-radius: 999px; }
  .card.owned .badge { background: #143628; color: var(--green); }
  .card.now-buy .badge { background: var(--gold); color: #191202; }
  .card.owned { opacity: .42; }

  .now-buy { border-color: var(--gold); box-shadow: 0 0 8px rgba(245, 196, 81, .45);
             animation: pulseGold 1.3s ease-in-out infinite; }
  .now-skill { border-color: var(--cyan) !important; box-shadow: 0 0 8px rgba(56, 232, 255, .5);
               animation: pulseCyan 1.3s ease-in-out infinite; }
  @keyframes pulseGold { 50% { box-shadow: 0 0 2px var(--gold), 0 0 4px rgba(245, 196, 81, .2); } }
  @keyframes pulseCyan { 50% { box-shadow: 0 0 2px var(--cyan), 0 0 4px rgba(56, 232, 255, .2); } }
  body.fx-off .now-buy { animation: none; box-shadow: none; border-color: var(--line); }
  body.fx-off .now-skill { animation: none; box-shadow: none; border-color: var(--line) !important; }
  @media (prefers-reduced-motion: reduce) { .now-buy, .now-skill { animation: none; } }

  .skill-strip { margin-top: 6px; padding-top: 5px; border-top: 1px solid var(--line); }
  .skills-inline { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .key { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; font: 900 11px/1 ui-monospace, Menlo, Consolas, monospace;
         color: #061218; background: linear-gradient(#b5f5ff, var(--cyan)); border: 1.5px solid #d9fbff; }
  .key.off { color: var(--sub); background: rgba(255, 255, 255, .06); border-color: var(--line2); }
  .order-keys { display: flex; align-items: center; gap: 3px; color: var(--dim); font-size: 9px; flex: none; }
  .tip { color: var(--sub); font-size: 9.5px; margin: 3px 0 0; overflow-wrap: anywhere; }

  .brief-sec { border-left: 3px solid var(--accent); }
  .brief-text { margin: 0; font-size: 10px; line-height: 1.42; color: #e8eef9; overflow-wrap: anywhere; }
  .brief-src { font-size: 9px; font-weight: 800; padding: 1px 5px; border-radius: 5px; background: rgba(255, 255, 255, .06); color: var(--sub); }
  .brief-src.llm { background: rgba(52, 211, 153, .16); color: var(--green); }

  .demo { margin-top: auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }
  .demo button { padding: 4px 2px; border-radius: 7px; border: 1px solid var(--line); background: var(--card); font-size: 10px; font-weight: 700; white-space: nowrap; }
  .demo button[aria-pressed="true"] { border-color: var(--accent); background: rgba(124, 110, 255, .18); color: #e1ddff; }
  .foot { color: var(--dim); font-size: 9px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="top" id="dragBar" title="상단 바를 드래그해 HUD 위치를 옮길 수 있습니다">
    <span class="grip" aria-hidden="true">⋮⋮</span>
    <button type="button" class="live" id="live" title="브리지에 연결되어 있으면 눌러서 LIVE 로 돌아갑니다">
      <span id="liveText">🟡 게임 중 시뮬레이션 (00:00)</span>
    </button>
    <button type="button" class="ctrl" id="focusBtn" aria-pressed="false" title="집중 모드: 핵심 1순위 전략·빌드·스킬만 간략히 표시">집중</button>
    <button type="button" class="fx" id="fx" aria-pressed="true">이펙트 ON</button>
    <button type="button" class="ctrl" id="opac" title="창 투명도 조절">92%</button>
    <button type="button" class="ctrl" id="minBtn" aria-expanded="true" title="창 최소화(접기/펼치기)">−</button>
    <button type="button" class="ctrl" id="closeBtn" title="오버레이 및 백그라운드 브리지 종료">×</button>
  </div>
  <div class="hk-bar">
    <span id="hkHint">F8 클릭통과 · F9 숨김</span>
    <span id="fsWarn" class="warn-fs" hidden>전체 화면(FSO) · 가려지면 테두리 없음 권장</span>
  </div>
  <div class="mini-bar" id="miniBar" hidden><span id="miniSummary">대기 중</span><span style="color:var(--dim);font-size:10px">최소화됨</span></div>

  <section class="win" aria-live="polite" aria-label="실시간 게임 중 승률">
    <div class="t"><b>실시간 게임 중 승률</b><span id="phaseNote">실시간 종합 판세</span></div>
    <div class="prob num" id="prob">--%</div>
    <span class="tac even" id="tac">분석 중</span>
    <div class="chips" id="factors"></div>
    <div class="stale-msg" id="staleMsg" hidden></div>
  </section>

  <section class="sec" aria-label="실시간 맞춤 전략">
    <h2>실시간 맞춤 전략 <small id="carryNote"></small></h2>
    <div class="strat-list" id="strats"></div>
  </section>

  <section class="sec lanes-sec" aria-label="전 라인 상황">
    <h2>전 라인 골드 비교 <small id="compNote"></small></h2>
    <div class="lanes" id="lanes"></div>
  </section>

  <section class="sec" aria-label="아이템 및 스킬">
    <h2>빌드 · 스킬 <small id="champ">카드를 누르면 보유 표시</small></h2>
    <div class="gold-bar" id="recallBar">보유 골드 확인 중</div>
    <div class="mrow"><span class="lab">시작</span><span class="mrow" id="starter"></span><span class="lab">상황별</span><span class="mrow" id="situ"></span></div>
    <div class="buy" id="buy"></div>
    <div class="skill-strip">
      <div class="skills-inline">
        <div style="font-size:10px;color:var(--sub);font-weight:700;">스킬 레벨업 <small id="lv" style="color:var(--dim);font-weight:600"></small> <small id="nextWhen" style="color:var(--cyan);font-weight:800"></small></div>
        <div class="order-keys" id="keys"></div>
      </div>
      <p class="tip" id="focus"></p>
    </div>
  </section>

  <section class="sec brief-sec" aria-label="AI 감독 브리핑" aria-live="polite">
    <h2>AI 감독 브리핑 <span class="brief-src" id="briefSrc">대기 중</span></h2>
    <p class="brief-text" id="briefText">실시간 전장 데이터를 분석해 전략 브리핑을 생성합니다</p>
  </section>

  <div class="demo" id="demoBar" role="group" aria-label="데모 시나리오">
    <button type="button" data-demo="ahead" aria-pressed="false">초반 우세 06:30</button>
    <button type="button" data-demo="even" aria-pressed="false">중반 박빙 14:20</button>
    <button type="button" data-demo="behind" aria-pressed="false">후반 열세 23:10</button>
  </div>
  <div class="foot" id="foot">실시간 전장 전략 엔진</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
const BRIDGE_URL = params.get("bridge_url") || "http://127.0.0.1:8765/bridge/state";
const BRIDGE_TOKEN = params.get("token") || "";
const WINDOW_URL = BRIDGE_URL.replace(/\/bridge\/state.*$/, "/bridge/window");
const SHUTDOWN_URL = BRIDGE_URL.replace(/\/bridge\/state.*$/, "/bridge/shutdown");
const POLL_MS = 2000;
const BRIEF_MIN_MS = 20000;

// 10인 전 라인·보유 골드·상대 아이템·생존자·오브젝트가 모두 다른 실시간 데모 시나리오
const DEMOS = {

    ctx: {
      game_time_sec: 390, my_side: "blue", first_blood: "blue",
      me: { champion: "Ahri", position: "MIDDLE", level: 6, kills: 2, deaths: 0, assists: 1, cs: 52, current_gold: 1180, item_gold: 400, items: [1056], is_dead: false, respawn_timer: 0 },
      allies: [
        { champion: "Garen", position: "TOP", level: 6, kills: 1, deaths: 0, assists: 0, cs: 48, item_gold: 850, items: [1054, 1028], is_dead: false, respawn_timer: 0 },
        { champion: "LeeSin", position: "JUNGLE", level: 5, kills: 1, deaths: 0, assists: 2, cs: 38, item_gold: 900, items: [1036], is_dead: false, respawn_timer: 0 },
        { champion: "Ahri", position: "MIDDLE", level: 6, kills: 2, deaths: 0, assists: 1, cs: 52, current_gold: 1180, item_gold: 400, items: [1056], is_dead: false, respawn_timer: 0 },
        { champion: "Jinx", position: "BOTTOM", level: 5, kills: 1, deaths: 1, assists: 0, cs: 45, item_gold: 800, items: [1055], is_dead: false, respawn_timer: 0 },
        { champion: "Lux", position: "UTILITY", level: 5, kills: 0, deaths: 0, assists: 2, cs: 8, item_gold: 600, items: [3865], is_dead: false, respawn_timer: 0 },
      ],
      enemies: [
        { champion: "Darius", position: "TOP", level: 5, kills: 0, deaths: 1, assists: 0, cs: 40, item_gold: 450, items: [1055], is_dead: false, respawn_timer: 0 },
        { champion: "Warwick", position: "JUNGLE", level: 5, kills: 0, deaths: 1, assists: 1, cs: 34, item_gold: 500, items: [], is_dead: true, respawn_timer: 18 },
        { champion: "Zed", position: "MIDDLE", level: 5, kills: 0, deaths: 2, assists: 0, cs: 44, item_gold: 700, items: [1036], is_dead: false, respawn_timer: 0 },
        { champion: "Caitlyn", position: "BOTTOM", level: 5, kills: 1, deaths: 1, assists: 0, cs: 49, item_gold: 950, items: [1055], is_dead: false, respawn_timer: 0 },

function skillPlan(order) {
  const keys = order ? order.split(">").map((s) => s.trim()) : [];
  const count = Object.fromEntries(keys.map((k) => [k, 0]));
  const plan = [];
  for (let lv = 1; lv <= 18; lv++) {
    if (lv === 6 || lv === 11 || lv === 16) { plan.push("R"); continue; }
    const cap = Math.min(Math.floor((lv + 1) / 2), 5);
    const pick = keys.find((k) => (lv <= 3 ? count[k] === 0 : count[k] < cap)) || null;
    if (pick) count[pick] += 1;
    plan.push(pick);
  }
  return plan;
}

const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const mmss = (t) => { const s = Math.max(0, Math.floor(t || 0)); return `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`; };

function icon(item) {
  const box = el("span", "icon");
  if (ddVersion && Number.isInteger(item.item_id)) {
    const img = new Image();
    img.alt = item.name; img.loading = "lazy";
    img.dataset.fb = item.name.slice(0, 3);
    img.src = `https://ddragon.leagueoflegends.com/cdn/${encodeURIComponent(ddVersion)}/img/item/${item.item_id}.png`;
    box.append(img);
  } else box.textContent = item.name.slice(0, 3);
  return box;
}
document.addEventListener("error", (e) => {
  const img = e.target;
  if (img instanceof HTMLImageElement && img.dataset.fb != null) { const p = img.parentElement; p.textContent = img.dataset.fb; }
}, true);

function miniRow(target, items, owned) {
  target.replaceChildren(...items.map((it) => {
    const own = owned.has(it.item_id);
    const m = icon(it);
    if (own) m.classList.add("owned");
    m.title = `${it.name} ${it.gold}G · ${it.why}${own ? " · ✓ 보유 완료" : ""}`;
    m.setAttribute("aria-label", m.title);
    if (own) m.append(el("span", "ck", "✓"));
    return m;
  }));
}

function stratTone(cat) {
  if (/수성|영혼 저지|부활|템포 조절|위협|바론 수성/.test(cat)) return "urgent";
  if (/귀환|골드|파워/.test(cat)) return "gold";
  if (/오브젝트|수적 우위|바론 운영|영혼 확정|스노우볼|전 라인/.test(cat)) return "macro";
  return "";
}

// ── AI 감독 전략 브리핑 (H5·M7·M8: category 키 + 최소 20초 간격 + 모드 변경 시 폐기 + '동적 전략'/'브리핑 없음') ──
let briefKey = null, briefBusy = false, lastBriefAt = 0;
function briefingKey(s) {
  const b = s.build_advice;
  const laneSig = (s.lanes || []).map((l) => `${l.position}:${l.status}`);
  const stSig = (s.strategies || []).slice(0, 2).map((x) => x.category);
  return JSON.stringify([s.phase, s.state, b.my_champion, laneSig, stSig, Math.round(s.win_prob * 50)]);
}
async function requestBriefing(s, ctx) {
  const key = briefingKey(s);
  const now = Date.now();
  if (!ctx || briefBusy || key === briefKey) return;
  if (lastBriefAt && (now - lastBriefAt) < BRIEF_MIN_MS) return;
  const reqMode = view ? view.mode : null;
  const reqDemo = view ? view.demo : null;
  briefBusy = true; briefKey = key; lastBriefAt = now;
  try {
    const res = await fetch("/strategy/briefing", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(ctx) });
    if (!res.ok) throw new Error(String(res.status));
    const r = await res.json();
    if (!view || view.mode !== reqMode || (reqMode === "demo" && view.demo !== reqDemo)) return;
    const llm = r.source === "llm";
    $("briefText").textContent = r.briefing;
    $("briefSrc").textContent = llm ? `LLM · ${r.llm_model}` : "동적 전략";
    $("briefSrc").className = llm ? "brief-src llm" : "brief-src";
  } catch (_) {
    if (!view || view.mode !== reqMode || (reqMode === "demo" && view.demo !== reqDemo)) return;
    $("briefText").textContent = "브리핑 없음";
    $("briefSrc").textContent = "동적 전략";
    briefKey = null;
  } finally {
    lastBriefAt = Date.now();
    briefBusy = false;
  }
}

$("buy").addEventListener("click", (e) => {
  const card = e.target.closest("[data-item]");
  if (!card || !view) return;
  const id = Number(card.dataset.item);

function controlHeaders() {
  const h = { "Content-Type": "application/json" };
  if (BRIDGE_TOKEN) h["X-Bridge-Token"] = BRIDGE_TOKEN;
  return h;
}
function sendWindowCmd(cmd) {
  fetch(WINDOW_URL, { method: "POST", headers: controlHeaders(), body: JSON.stringify(cmd) }).catch(() => {});
}

let dragStart = null;
$("dragBar").addEventListener("mousedown", (e) => {
  if (e.target.closest("button")) return;
  dragStart = { x: e.screenX, y: e.screenY };
});
window.addEventListener("mouseup", (e) => {
  if (!dragStart) return;
  const dx = Math.round(e.screenX - dragStart.x);
  const dy = Math.round(e.screenY - dragStart.y);
  dragStart = null;
  if (Math.abs(dx) > 4 || Math.abs(dy) > 4) sendWindowCmd({ dx, dy });
});

// ── 데모 ──
async function runDemo(name, lock) {
  const d = DEMOS[name];
  try {
    const res = await fetch("/strategy", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(d.ctx) });
    if (!res.ok) throw new Error(`서버 ${res.status}`);
    const strat = await res.json();
    if (lock) demoLock = true;
    if (!lock && (demoLock || (bridgeAlive && lastLive))) return;
    const b = strat.build_advice;
    const owned = new Set([...(d.ctx.me.items || []), ...b.recommended_items.slice(0, d.ownedSteps).map((i) => i.item_id)].filter(Number.isInteger));
    const plan = skillPlan(b.skill_order.order);
    view = { mode: "demo", demo: name, t: d.t, strategy: strat, ctx: d.ctx, owned, level: d.level, next: plan[d.level - 1], when: "now", hudWindow: lastLive ? lastLive.hud_window : null };
    lastBriefAt = 0;  // 데모 버튼 전환 시에는 새 시나리오 브리핑을 바로 표시
    render();
  } catch (err) {
    $("briefText").textContent = `서버에 연결하지 못했어요 (${err.message})`;
  }
}
document.querySelectorAll("[data-demo]").forEach((btn) => btn.addEventListener("click", () => runDemo(btn.dataset.demo, true)));

function coachFallbackView(st) {
  const c = st.coach, b = c.build_advice;
  const goal = (c.coaching && c.coaching[0]) ? c.coaching[0].message : "지금 페이스 유지";
  return {
    mode: "live",
    t: st.game_time_sec,
    strategy: {
      phase: "mid",
      phase_label: "코치 폴백",
      win_prob: c.my_win_prob,
      state: b.state,
      state_ko: b.state === "ahead" ? "우세" : b.state === "behind" ? "열세" : "박빙",
      tactical_badge: b.posture,
      team_gold_diff: 0,
      alive: { ally: 5, enemy: 5 },
      key_factors: [c.pace],
      lanes: [],
      ally_carry: null,
      enemy_comp: null,
      recall_advice: { message: "카드를 누르면 보유 표시" },
      strategies: [{ category: "코치 폴백", title: goal, detail: b.tactical_tip || b.posture }],
      build_advice: b,
      model_version: c.model_version,
      summary_briefing: goal,
    },
    ctx: null,
    owned: new Set((st.owned_items || []).map((i) => i.itemID)),
    level: st.level,
    next: st.next_skill,
    when: st.next_skill_when,
    hudWindow: st.hud_window || null,
    stale: !!st.coach_error,
  };
}
function applyLive(st) {
  if (!st.strategy && st.coach) {
    view = coachFallbackView(st);
    render();
    return;
  }
  view = {
    mode: "live",
    t: st.game_time_sec,
    strategy: st.strategy,
    ctx: st.live_context,
    owned: new Set((st.owned_items || []).map((i) => i.itemID)),
    level: st.level,
    next: st.next_skill,
    when: st.next_skill_when,
    hudWindow: st.hud_window || null,
    stale: !!st.strategy_error,
  };
  render();
}
async function poll() {
  try {
    const res = await fetch(BRIDGE_URL, { cache: "no-store" });
    const st = await res.json();
    if (st.hud_window && view) view.hudWindow = st.hud_window;
    bridgeAlive = !!(st.connected && (st.strategy || st.coach));
    if (bridgeAlive) { lastLive = st; if (!demoLock) applyLive(st); }
    else if (view && view.mode === "live") { view.mode = "demo"; render(); }
  } catch (_) {
    bridgeAlive = false;
    if (view && view.mode === "live") { view.mode = "demo"; render(); }
  }
}
$("live").addEventListener("click", () => {
  demoLock = false;
  if (bridgeAlive && lastLive) applyLive(lastLive);
});

// ── 투명도 (M7: 초기 로드 시 저장된 투명도를 OS 창에 동기화) & 최소화 & 종료 ──
const OPAC_STEPS = [0.92, 0.78, 0.62];
let opacIdx = 0;
try {
  const savedOp = Number(localStorage.getItem("lol_hud_opac") || "0.92");
  const idx = OPAC_STEPS.indexOf(savedOp);
  if (idx >= 0) opacIdx = idx;
} catch (_) {}
function applyOpac(pushNative) {
  const val = OPAC_STEPS[opacIdx] || 0.92;
  document.body.style.opacity = String(Math.max(0.82, val));
  $("opac").textContent = `${Math.round(val * 100)}%`;
  if (pushNative) sendWindowCmd({ opacity: val });
}
applyOpac(true);
$("opac").addEventListener("click", () => {
  opacIdx = (opacIdx + 1) % OPAC_STEPS.length;
  applyOpac(true);
  try { localStorage.setItem("lol_hud_opac", String(OPAC_STEPS[opacIdx])); } catch (_) {}
});

function setFocusMode(on) {
  document.body.classList.toggle("focus-mode", on);
  $("focusBtn").setAttribute("aria-pressed", String(on));
  try { localStorage.setItem("lol_hud_focus", on ? "1" : "0"); } catch (_) {}
}
try { setFocusMode(localStorage.getItem("lol_hud_focus") === "1"); } catch (_) {}
$("focusBtn").addEventListener("click", () => setFocusMode(!document.body.classList.contains("focus-mode")));

function setMinimized(on) {
  document.body.classList.toggle("minimized", on);
  $("minBtn").setAttribute("aria-expanded", String(!on));
  $("minBtn").textContent = on ? "+" : "−";
  $("miniBar").hidden = !on;
  if (on) {
    const p = $("prob").textContent || "--%";
    const sk = $("nextWhen").textContent || "-";
    $("miniSummary").textContent = `판세 ${p} · ${sk}`;
  }
}
$("minBtn").addEventListener("click", () => setMinimized(!document.body.classList.contains("minimized")));
$("closeBtn").addEventListener("click", () => {
  fetch(SHUTDOWN_URL, { method: "POST", headers: controlHeaders(), body: "{}" }).catch(() => {}).finally(() => {
    try { window.close(); } catch (_) {}
  });
});

(async () => {
  try { ddVersion = (await (await fetch("/meta/champions")).json()).version; } catch (_) { ddVersion = null; }
  await poll();
  if (!bridgeAlive) await runDemo("even", false);
  setInterval(poll, POLL_MS);
})();
</script>
